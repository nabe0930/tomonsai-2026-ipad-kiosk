<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123e40">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<title>稲門祭2026 セルフ受付・試作</title>
<style>
  :root{color-scheme:light;--ink:#123e40;--muted:#50696a;--paper:#f5f6ee;--line:#c8d5d0;--accent:#006f73;--warn:#8f4300;--bad:#9d2626}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.5}
  header{background:var(--ink);color:#fff;padding:18px max(18px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px}
  header strong{font-size:clamp(20px,3vw,29px)}header small{font-size:14px;opacity:.9}main{max-width:1000px;margin:auto;padding:22px 18px 70px}
  h1{font-size:clamp(25px,4vw,38px);line-height:1.25;margin:10px 0 14px}h2{font-size:24px;margin:20px 0 12px}h3{font-size:19px;margin:0 0 10px}p{margin:8px 0 14px}
  .banner{border:2px solid #dfa05d;background:#fff4e8;color:#643000;padding:14px 16px;border-radius:12px;font-weight:700;margin:12px 0 18px}
  .notice{border:1px solid var(--line);background:#fff;padding:14px 16px;border-radius:12px;margin:12px 0}.error{border-color:#df9a9a;background:#fff2f2;color:#772020}
  .muted{color:var(--muted)}.tiny{font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  .card{border:2px solid var(--line);border-radius:16px;background:#fff;padding:18px}.card.selected{border-color:var(--accent);box-shadow:0 0 0 3px #006f7330}.card .time{font-size:31px;font-weight:800}.card .remain{font-size:18px;font-weight:700}
  button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:11px;background:var(--accent);color:#fff;font-weight:700;padding:13px 19px;min-height:50px}button:disabled{opacity:.42;cursor:not-allowed}button.secondary{background:#e7efeb;color:var(--ink)}button.danger{background:var(--bad)}button.small{min-height:36px;padding:7px 11px;font-size:14px}button.ghost{background:transparent;color:inherit;border:1px solid currentColor}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.field{display:block;margin:14px 0;font-weight:700}.field input,.field select{display:block;width:100%;max-width:350px;margin-top:6px;padding:12px;border:2px solid var(--line);border-radius:9px;background:#fff;min-height:49px}
  .choice{display:flex;gap:9px;flex-wrap:wrap}.choice button{min-width:76px}.choice button.active{background:var(--ink);outline:3px solid #bad8d4}.check{display:flex;gap:12px;align-items:flex-start;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.check input{width:24px;height:24px;flex:none;margin-top:2px}
  .summary{font-size:20px;font-weight:700;padding:17px;background:#e5f2ed;border-radius:12px;margin:16px 0}.ticket{max-width:720px;margin:20px auto;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:28px;text-align:center}.code{font-size:clamp(42px,9vw,77px);letter-spacing:.1em;font-weight:900;line-height:1.2;margin:20px 0}.ticket .when{font-size:clamp(24px,4vw,34px);font-weight:800}
  footer{max-width:1000px;margin:auto;padding:18px;color:var(--muted);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}th{background:#e7efeb}.scroll{overflow-x:auto}.actions{display:flex;gap:5px;flex-wrap:wrap;min-width:230px}.adminstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}.stat b{display:block;font-size:22px}
  .adminnav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.hidden{display:none!important}
  @media(max-width:600px){main{padding:14px 12px 60px}.card{padding:14px}header{padding:12px}header small{display:none}.ticket{padding:16px}.code{letter-spacing:.04em}footer{padding:12px}.actions{min-width:180px}}
</style>
</head>
<body>
<header><strong>透明標本づくり 受付</strong><small>稲門祭2026 · 8号館 B105</small></header>
<main>
  <div id="alert" role="alert" class="hidden"></div>
  <section id="guest"></section>
  <section id="ticket" class="hidden"></section>
  <section id="login" class="hidden"></section>
  <section id="admin" class="hidden"></section>
</main>
<footer><span>この端末での予約受付です。支払いと参加確認はスタッフが行います。</span><button id="admin-entry" class="secondary small" type="button">運営者用</button></footer>
<script>
(() => {
  'use strict';
  const KEY='tomonsai-2026-ipad-kiosk-v1';
  const EVENT_DATE='2026-10-18';
  const TIMES=['10:45','11:30','13:00','13:45','14:30'];
  const ALPHABET='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  const $=id=>document.getElementById(id);
  const esc=x=>String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
  const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n);
  const stamp=()=>new Date().toISOString();
  const minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3));
  const before5=t=>{const m=minutes(t)-5;return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`};
  const defaultData=()=>({version:1,revision:0,pin:null,settings:{date:EVENT_DATE,price:null,roomLimit:null,duration:null,open:false,slots:TIMES.map((time,i)=>({id:String(i+1),time,capacity:3}))},tickets:[]});
  let data=null,storageReady=false,screen='guest',selected=null,participants=1,children=false,guardians=0,safetyAcknowledged=false,bookingBusy=false,adminActive=false,adminLast=0,shownTicket=null,ticketDeadline=0,ticketTimer=null,loginFails=0,loginLockedUntil=0;
  function valid(d){
    if(!d||d.version!==1||!Number.isInteger(d.revision)||d.revision<0||!(d.pin===null||d.pin&&/^[0-9a-f]{32}$/.test(d.pin.salt)&&/^[0-9a-f]{64}$/.test(d.pin.hash)))throw Error('保存形式が不正です');
    const s=d.settings;if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s.date)||Number.isNaN(Date.parse(`${s.date}T00:00:00Z`))||new Date(`${s.date}T00:00:00Z`).toISOString().slice(0,10)!==s.date||!(s.price===null||Number.isInteger(s.price)&&s.price>=0&&s.price<=100000)||!(s.roomLimit===null||Number.isInteger(s.roomLimit)&&s.roomLimit>=1&&s.roomLimit<=30)||!(s.duration===null||Number.isInteger(s.duration)&&s.duration>=5&&s.duration<=120)||typeof s.open!=='boolean'||!Array.isArray(s.slots)||s.slots.length!==5)throw Error('設定が不正です');
    const seenTime=new Set();for(let i=0;i<5;i++){const x=s.slots[i];if(!x||x.id!==String(i+1)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(x.time)||seenTime.has(x.time)||!Number.isInteger(x.capacity)||x.capacity<1||x.capacity>30)throw Error('枠設定が不正です');seenTime.add(x.time)}
    if(!Array.isArray(d.tickets)||d.tickets.length>3000)throw Error('記録数が不正です');const codes=new Set();for(const t of d.tickets){if(!t||!Array.from({length:5},(_,i)=>String(i+1)).includes(t.slotId)||!new RegExp(`^[${ALPHABET}]{8}$`).test(t.code)||codes.has(t.code)||!Number.isInteger(t.participants)||t.participants<1||t.participants>30||!Number.isInteger(t.guardians)||t.guardians<0||t.guardians>30||typeof t.children!=='boolean'||!['reserved','seated','completed','cancelled'].includes(t.status)||!Number.isInteger(t.unitPrice)||t.unitPrice<0||t.unitPrice>100000||typeof t.createdAt!=='string'||!Number.isFinite(Date.parse(t.createdAt))||!(t.payment===null||t.payment&&['cash','qr'].includes(t.payment.method)&&Number.isInteger(t.payment.amount)&&t.payment.amount>=0&&typeof t.payment.at==='string'&&Number.isFinite(Date.parse(t.payment.at))&&(t.payment.refundAt===null||typeof t.payment.refundAt==='string'&&Number.isFinite(Date.parse(t.payment.refundAt))))){throw Error('番号札データが不正です')}codes.add(t.code)}
    if((s.open||d.tickets.length)&&(s.price===null||s.roomLimit===null||s.duration===null||d.pin===null))throw Error('受付条件が不正です');
    if(s.duration!==null&&s.slots.some((x,i)=>minutes(x.time)<605||minutes(x.time)+s.duration>950||(i>0&&minutes(x.time)<minutes(s.slots[i-1].time)+s.duration+10)))throw Error('枠間隔が不正です');
    if(s.roomLimit!==null){for(const slot of s.slots){const active=d.tickets.filter(t=>t.slotId===slot.id&&t.status!=='cancelled');if(active.reduce((n,t)=>n+t.participants,0)>slot.capacity||active.reduce((n,t)=>n+t.participants+t.guardians,0)>s.roomLimit)throw Error('復元ファイルが定員を超えます')}}
    return d;
  }
  function read(){const raw=localStorage.getItem(KEY);return valid(raw?JSON.parse(raw):defaultData())}
  function save(next){valid(next);const raw=JSON.stringify(next);localStorage.setItem(KEY,raw);if(localStorage.getItem(KEY)!==raw)throw Error('保存を確認できません');data=next;storageReady=true}
  function init(){try{data=read();if(!localStorage.getItem(KEY))save(data);else storageReady=true}catch(e){storageReady=false;data=defaultData();setAlert('受付記録を読み込めません。新規受付を止めました。端末内の保存状態を確認してください。','error')}render()}
  function update(fn){if(!storageReady)throw Error('保存が使えません');const fresh=read();if(fresh.revision!==data.revision){data=fresh;render();throw Error('別画面で記録が更新されました。内容を確認してやり直してください')};const next=structuredClone(fresh);fn(next);next.revision++;save(next);render()}
  function setAlert(message,kind='notice'){const a=$('alert');a.className=kind==='error'?'notice error':'notice';a.textContent=message;a.scrollIntoView({block:'nearest'})}
  function clearAlert(){$('alert').className='hidden';$('alert').textContent=''}
  function show(which){screen=which;for(const id of ['guest','ticket','login','admin'])$(id).classList.toggle('hidden',id!==which);$('admin-entry').classList.toggle('hidden',which==='admin'||which==='ticket'||which==='login');render()}
  function activeCount(slotId){return data.tickets.filter(t=>t.slotId===slotId&&t.status!=='cancelled')}
  function roomUsed(slotId){return activeCount(slotId).reduce((n,t)=>n+t.participants+t.guardians,0)}
  function seatsUsed(slotId){return activeCount(slotId).reduce((n,t)=>n+t.participants,0)}
  function bookingWindow(slot){const d=new Date();if(d.getHours()*60+d.getMinutes()>=minutes(slot.time)-10)return '受付終了';return null}
  function reason(slot){if(!storageReady)return '保存を確認できません';const s=data.settings;if(!s.open)return '受付停止中';if(s.price===null||s.roomLimit===null||s.duration===null||!data.pin)return '運営設定が未完了';return bookingWindow(slot)}
  function bookingOkFor(d,slot,p,c,g){if(!slot)throw Error('枠が見つかりません');if(!storageReady||!d.settings.open||d.settings.price===null||d.settings.roomLimit===null||d.settings.duration===null||!d.pin)throw Error('受付停止中です');if(new Date().getHours()*60+new Date().getMinutes()>=minutes(slot.time)-10)throw Error('この枠の受付時間ではありません');if(!Number.isInteger(p)||p<1||p>slot.capacity||typeof c!=='boolean'||!Number.isInteger(g)||g<0||g>3||c&&g<1||!c&&g!==0)throw Error('人数と保護者を確認してください');const active=d.tickets.filter(t=>t.slotId===slot.id&&t.status!=='cancelled');if(active.reduce((n,t)=>n+t.participants,0)+p>slot.capacity)throw Error('参加枠が満席です');if(active.reduce((n,t)=>n+t.participants+t.guardians,0)+p+g>d.settings.roomLimit)throw Error('在室人数の上限を超えます')}
  function makeSalt(){if(!crypto?.getRandomValues)throw Error('安全なPIN設定ができません');const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')}
  async function hashPin(pin,salt){if(!crypto?.subtle)throw Error('この環境ではPIN保護を使えません。HTTPSで開いてください');const bytes=new TextEncoder().encode(`${salt}:${pin}`);const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('')}
  function makeCode(){if(!crypto?.getRandomValues)throw Error('安全な番号生成ができません');for(let tries=0;tries<20;tries++){const a=new Uint8Array(8);crypto.getRandomValues(a);const code=Array.from(a,x=>ALPHABET[x%ALPHABET.length]).join('');if(!data.tickets.some(t=>t.code===code))return code}throw Error('番号を生成できません')}
  function renderGuest(){const s=data.settings;const closed=!s.open||!storageReady;const top=closed?'<div class="banner">ただいま新規受付を停止しています。スタッフにお声がけください。</div>':'';
    const cards=s.slots.map(slot=>{const used=seatsUsed(slot.id),room=roomUsed(slot.id),rem=Math.max(0,slot.capacity-used),roomRem=s.roomLimit===null?'未設定':Math.max(0,s.roomLimit-room);const why=reason(slot);const disabled=!!why||rem===0||s.roomLimit!==null&&roomRem===0;const label=why||rem===0||roomRem===0?'受付不可':'この枠を選ぶ';return `<div class="card ${selected===slot.id?'selected':''}"><div class="time">${esc(slot.time)}</div><div class="tiny muted">所要 ${s.duration??'未設定'} 分</div><div class="remain">残り ${rem} 名</div><div class="muted tiny">付き添いを含む在室余裕：${esc(roomRem)} 名</div><button type="button" data-select="${slot.id}" ${disabled?'disabled':''}>${label}</button>${why?`<div class="tiny muted">${esc(why)}</div>`:''}</div>`}).join('');
    let form='';const slot=s.slots.find(x=>x.id===selected);if(slot&&!reason(slot)){const price=s.price===null?'未設定':yen(s.price);const available=Math.max(0,Math.min(3,slot.capacity-seatsUsed(slot.id),s.roomLimit-roomUsed(slot.id)-guardians));if(available>0&&participants>available)participants=available;const guardianChoice=children?`<label class="field">見守りだけの保護者（体験しない方）<select id="guardian-count"><option value="1" ${guardians===1?'selected':''}>1名</option><option value="2" ${guardians===2?'selected':''}>2名</option><option value="3" ${guardians===3?'selected':''}>3名</option></select></label>`:'';const total=s.price===null?'未設定':yen(s.price*participants);form=`<div class="card" id="guest-form"><h2>${esc(slot.time)} の受付内容</h2><p>体験する人数を選択してください。見守りだけの保護者は参加人数に含めません。保護者も制作する場合は参加人数に含めてください。</p><div class="choice" role="group" aria-label="参加人数">${Array.from({length:available},(_,i)=>`<button type="button" class="${participants===i+1?'active':'secondary'}" data-people="${i+1}">${i+1}名</button>`).join('')}</div><label class="check" style="margin-top:18px"><input id="children" type="checkbox" ${children?'checked':''}><span>小学生以下の参加者がいる（保護者同伴が必要）</span></label>${guardianChoice}<div class="summary">${participants}名分 ${total} ／ 開始5分前の ${before5(slot.time)} までにスタッフへ</div><p class="muted">単価 ${price}。この画面で支払いは行いません。番号をスタッフに見せてください。</p><div class="notice"><strong>体験時の注意</strong><br>標本やグリセリンを口に入れないでください。液体をこぼしたり容器を落としたりしたら、すぐスタッフに知らせてください。道具や封入作業はスタッフの説明に従ってください。小学生以下は保護者同伴です。</div><label class="check"><input id="safety-check" type="checkbox" ${safetyAcknowledged?'checked':''}><span>上の注意を読みました。参加前にスタッフから直接説明を受けます。</span></label><div class="row" style="margin-top:17px"><button type="button" id="reserve" ${bookingBusy||available<1?'disabled':''}>内容を確認して番号を発行</button><button type="button" id="cancel-choice" class="secondary">枠選択に戻る</button></div></div>`}
    $('guest').innerHTML=`<h1>時間を選んでください</h1><p>8号館B105。受付番号を発行します。<strong>支払い・参加確認は体験前にスタッフが行います。</strong></p>${top}<div class="grid">${cards}</div>${form}<div class="notice tiny">${s.open?'このiPadの予約です。別の端末とは同期しません。番号を控えられない方は、予約前にスタッフへお声がけください。行けなくなった場合は番号をスタッフへ伝えてください。':'枠時刻・定員・料金が確定するまで受付は始まりません。'} 同じ受付ページを複数のタブで開かないでください。</div>`;
  }
  function renderTicket(){if(!shownTicket)return;const t=shownTicket;const slot=data.settings.slots.find(x=>x.id===t.slotId);const left=Math.max(0,Math.ceil((ticketDeadline-Date.now())/1000));$('ticket').innerHTML=`<div class="ticket"><h1>仮予約の番号を発行しました</h1><div class="code">${esc(t.code)}</div><div class="when">${EVENT_DATE} ${esc(slot.time)} 開始 · 所要 ${data.settings.duration} 分</div><p>参加 ${t.participants}名 ／ 付き添い ${t.guardians}名 ／ ${yen(t.unitPrice*t.participants)}</p><div class="banner">${before5(slot.time)} までに、この番号をスタッフに見せてください。入金・着席の確認後に参加できます。この画面では支払いは完了していません。</div><p>番号を写真に撮るか、用意された紙に控えてください。控えを失くしたら枠時刻と人数をスタッフに伝えてください。画面は <strong id="countdown">${left}</strong> 秒後に消えます。</p><div class="row" style="justify-content:center"><button type="button" id="extend" class="secondary">表示を30秒延長</button><button type="button" id="ticket-done">控えました</button></div></div>`}
  function renderLogin(){const setup=data.pin===null;$('login').innerHTML=`<div class="card" style="max-width:520px;margin:auto"><h1>${setup?'運営者PINの初期設定':'運営者ログイン'}</h1><p class="muted">${setup?'来場者に端末を渡す前に6桁の数字を設定してください。':'設定・入金確認・取消は運営者だけが操作してください。'}このPINは誤操作防止用で、強い認証ではありません。</p><label class="field">6桁のPIN<input id="pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}"></label><div class="row"><button id="pin-submit">${setup?'設定して開く':'開く'}</button><button id="login-cancel" class="secondary">戻る</button></div></div>`}
  function label(t){if(t.status==='cancelled')return t.payment&&!t.payment.refundAt?'取消・返金要確認':'取消';if(t.status==='completed')return '体験完了';if(t.status==='seated')return '着席確認';return t.payment?'入金確認済':'予約'}
  function renderAdmin(){if(!adminActive){show('guest');return}const s=data.settings;const locked=data.tickets.length>0;const stats=s.slots.map(x=>`<div class="stat"><span>${esc(x.time)}</span><b>${seatsUsed(x.id)} / ${x.capacity}</b><span class="tiny">在室 ${roomUsed(x.id)} / ${s.roomLimit??'未設定'}</span></div>`).join('');const rows=data.tickets.slice().sort((a,b)=>a.slotId.localeCompare(b.slotId)||a.createdAt.localeCompare(b.createdAt)).map(t=>{const x=s.slots.find(y=>y.id===t.slotId);let acts='';if(t.status==='reserved'){if(!t.payment&&t.unitPrice>0)acts+=`<button class="small" data-action="pay-cash" data-code="${t.code}">現金確認</button><button class="small" data-action="pay-qr" data-code="${t.code}">QR確認</button>`;if(t.payment||t.unitPrice===0)acts+=`<button class="small" data-action="seat" data-code="${t.code}">着席確認</button>`}if(t.status==='seated')acts+=`<button class="small" data-action="complete" data-code="${t.code}">完了</button>`;if(['reserved','seated'].includes(t.status))acts+=`<button class="small danger" data-action="cancel" data-code="${t.code}">取消</button>`;if(t.status==='cancelled'&&t.payment&&!t.payment.refundAt)acts+=`<button class="small danger" data-action="refund" data-code="${t.code}">実返金を確認</button>`;return `<tr><td><b>${t.code}</b></td><td>${esc(x.time)}</td><td>${t.participants}名<br>同伴 ${t.guardians}名</td><td>${esc(label(t))}</td><td>${t.payment?`${esc(t.payment.method==='cash'?'現金':'QR')} ${yen(t.payment.amount)}`:'—'}</td><td><div class="actions">${acts}</div></td></tr>`}).join('');const settingsRows=s.slots.map((x,i)=>`<div class="row"><label class="field">枠 ${i+1} 時刻<input name="time${i}" type="time" value="${esc(x.time)}" ${locked?'disabled':''}></label><label class="field">参加定員<input name="cap${i}" type="number" min="1" max="30" value="${x.capacity}" ${locked?'disabled':''}></label></div>`).join('');
    $('admin').innerHTML=`<div class="row spread"><div><h1>運営者画面</h1><p>このiPad内の記録です。別端末の予約とは共有されません。</p></div><button id="admin-exit" class="secondary">受付画面に戻す</button></div><div class="banner">${s.open?'受付中':'新規受付は停止中'} ／ 料金 ${s.price===null?'未設定':yen(s.price)} ／ 所要 ${s.duration??'未設定'} 分<br>単一料金でよいこと、枠・定員・室内人数・体験所要時間が2026年の実施条件に合うことを確認してください。</div><div class="adminnav"><button id="toggle-intake" ${!storageReady?'disabled':''}>${s.open?'受付を止める':'受付を開く'}</button><button id="export-json" class="secondary">JSON控えを保存</button><button id="export-csv" class="secondary">CSV控えを保存</button><button id="change-pin" class="secondary">PIN変更</button></div><div class="adminstats">${stats}</div><h2>番号札 ${data.tickets.length}件</h2><div class="scroll"><table><thead><tr><th>番号</th><th>開始</th><th>人数</th><th>状態</th><th>入金記録</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan="6">まだ発行していません</td></tr>'}</tbody></table></div><h2>設定</h2><div class="notice">${locked?'番号札発行後は料金・時刻・定員を変更できません。受付の開始・停止は可能です。':'料金、時刻、参加定員、付き添いを含む在室上限を確認してください。'}</div><form id="settings-form"><label class="field">参加者1名の料金（円。無料なら0）<input name="price" type="number" min="0" max="100000" value="${s.price??''}" placeholder="未設定" ${locked?'disabled':''}></label><label class="field">体験所要時間（分）<input name="duration" type="number" min="5" max="120" value="${s.duration??''}" placeholder="未設定" ${locked?'disabled':''}></label><label class="field">付き添いを含む1枠の在室上限<input name="roomLimit" type="number" min="1" max="30" value="${s.roomLimit??''}" placeholder="未設定" ${locked?'disabled':''}></label>${settingsRows}<button type="submit" ${locked?'disabled':''}>設定を保存</button></form><h2>控えの復元</h2><div class="notice tiny">復元は現在の記録を丸ごと置き換えます。まずJSONを別端末に保存し、復元するファイルと時刻を確認してください。</div><input id="restore-file" type="file" accept="application/json,.json"><button type="button" id="restore" class="secondary">JSONから復元</button><p class="tiny muted">管理PINと端末内保存は強いセキュリティ対策ではありません。氏名・連絡先・カード情報は保存しません。現金/QRの入金確認記録は端末に保存します。旧スタッフ用受付試作とは別台帳です。同時に使わないでください。</p>`;
  }
  function render(){for(const id of ['guest','ticket','login','admin'])$(id).classList.toggle('hidden',id!==screen);if(screen==='guest')renderGuest();else if(screen==='ticket')renderTicket();else if(screen==='login')renderLogin();else if(screen==='admin')renderAdmin()}
  function guestReset(){clearAlert();shownTicket=null;selected=null;participants=1;children=false;guardians=0;safetyAcknowledged=false;clearInterval(ticketTimer);ticketTimer=null;show('guest')}
  function startTicket(t){shownTicket=t;ticketDeadline=Date.now()+60000;show('ticket');clearInterval(ticketTimer);ticketTimer=setInterval(()=>{if(screen!=='ticket')return;const n=Math.max(0,Math.ceil((ticketDeadline-Date.now())/1000));const el=$('countdown');if(el)el.textContent=n;if(n===0)guestReset()},250)}
  function book(){if(bookingBusy)return;const slot=data.settings.slots.find(x=>x.id===selected);const p=participants,c=children,g=guardians;if(!safetyAcknowledged){setAlert('注意事項を確認してください','error');return}try{bookingOkFor(data,slot,p,c,g)}catch(e){setAlert(e.message,'error');return}if(!confirm(`${slot.time} 開始・所要 ${data.settings.duration}分\n体験 ${p}名、見守りの保護者 ${g}名\n料金 ${yen(data.settings.price*p)}（この画面では未払い）\n\nこの内容で仮予約番号を発行しますか？`))return;bookingBusy=true;renderGuest();try{const code=makeCode();let issued;update(d=>{const freshSlot=d.settings.slots.find(x=>x.id===slot.id);bookingOkFor(d,freshSlot,p,c,g);if(d.tickets.some(t=>t.code===code))throw Error('番号が重複しました');issued={code,slotId:slot.id,participants:p,guardians:g,children:c,status:'reserved',unitPrice:d.settings.price,createdAt:stamp(),payment:null};d.tickets.push(issued)});clearAlert();startTicket(issued)}catch(e){setAlert(`受付できませんでした：${e.message}`,'error')}finally{bookingBusy=false}}
  function touchAdmin(){adminLast=Date.now()}
  async function doLogin(){if(Date.now()<loginLockedUntil){setAlert('少し時間を置いてから操作してください','error');return}const pin=$('pin-input')?.value||'';if(!/^\d{6}$/.test(pin)){setAlert('6桁の数字を入力してください','error');return}try{if(data.pin===null){const salt=makeSalt(),hash=await hashPin(pin,salt);update(d=>{if(d.pin!==null)throw Error('既にPINが設定されています');d.pin={salt,hash}});adminActive=true;touchAdmin();clearAlert();show('admin');return}const hash=await hashPin(pin,data.pin.salt);if(hash!==data.pin.hash){loginFails++;if(loginFails>=5){loginLockedUntil=Date.now()+30000;loginFails=0}setAlert('PINが違います','error');return}loginFails=0;adminActive=true;touchAdmin();clearAlert();show('admin')}catch(e){setAlert(e.message,'error')}}
  async function changePin(){const pin=prompt('新しい6桁の数字PINを入力してください');if(pin===null)return;if(!/^\d{6}$/.test(pin))return setAlert('PINは6桁の数字です','error');try{const salt=makeSalt(),hash=await hashPin(pin,salt);update(d=>{d.pin={salt,hash}});setAlert('PINを変更しました')}catch(e){setAlert(e.message,'error')}}
  function adminAction(action,code){touchAdmin();const t=data.tickets.find(x=>x.code===code);if(!t)return setAlert('番号札が見つかりません','error');let message='';if(action==='pay-cash'||action==='pay-qr'){if(t.payment||t.status!=='reserved'||t.unitPrice<=0)return;const amount=t.unitPrice*t.participants;message=`${code}：実際に ${yen(amount)} の${action==='pay-cash'?'現金':'QR'}入金を確認しましたか？\nこの操作は決済を実行しません。`}else if(action==='seat')message=`${code}：支払い・保護者同伴・安全説明を対面で確認し、着席を記録しますか？`;else if(action==='complete')message=`${code}：体験完了を記録しますか？`;else if(action==='cancel')message=`${code}：番号札を取消しますか？${t.payment?'\n入金記録は残り、返金要確認になります。':''}`;else if(action==='refund')message=`${code}：実際の返金を完了したことを確認しましたか？\nこの操作は返金を実行しません。`;if(!message||!confirm(message))return;try{update(d=>{const x=d.tickets.find(y=>y.code===code);if(!x)throw Error('番号が見つかりません');if(action==='pay-cash'||action==='pay-qr'){if(x.status!=='reserved'||x.payment||x.unitPrice<=0)throw Error('入金済みか操作不能です');x.payment={method:action==='pay-cash'?'cash':'qr',amount:x.unitPrice*x.participants,at:stamp(),refundAt:null}}else if(action==='seat'){if(x.status!=='reserved'||!(x.payment||x.unitPrice===0))throw Error('入金未確認です');x.status='seated'}else if(action==='complete'){if(x.status!=='seated')throw Error('着席確認前です');x.status='completed'}else if(action==='cancel'){if(!['reserved','seated'].includes(x.status))throw Error('取消できません');x.status='cancelled'}else if(action==='refund'){if(x.status!=='cancelled'||!x.payment||x.payment.refundAt)throw Error('返金待ちではありません');x.payment.refundAt=stamp()}});setAlert(`${code} の記録を更新しました`)}catch(e){setAlert(e.message,'error')}}
  function saveSettings(ev){
    ev.preventDefault();touchAdmin();if(data.tickets.length)return setAlert('番号札発行後は設定を変更できません','error');
    const f=new FormData(ev.target),priceText=String(f.get('price')||''),roomText=String(f.get('roomLimit')||''),durationText=String(f.get('duration')||'');
    const price=priceText===''?null:Number(priceText),roomLimit=roomText===''?null:Number(roomText),duration=durationText===''?null:Number(durationText);
    const slots=Array.from({length:5},(_,i)=>({id:String(i+1),time:String(f.get(`time${i}`)||''),capacity:Number(f.get(`cap${i}`))}));
    const basic=Number.isInteger(price)&&price>=0&&price<=100000&&Number.isInteger(roomLimit)&&roomLimit>=1&&roomLimit<=30&&Number.isInteger(duration)&&duration>=5&&duration<=120&&slots.every(x=>/^([01]\d|2[0-3]):[0-5]\d$/.test(x.time)&&Number.isInteger(x.capacity)&&x.capacity>=1&&x.capacity<=30);
    const timesOk=basic&&slots.every((x,i)=>minutes(x.time)>=605&&minutes(x.time)+duration<=950&&(i===0||minutes(x.time)>=minutes(slots[i-1].time)+duration+10));
    if(!basic||!timesOk){setAlert('単一料金・在室上限・所要時間・枠を確認してください。枠は10:05～15:50内、所要時間と10分の入替を確保してください。','error');return}
    try{update(d=>{if(d.tickets.length)throw Error('番号札が発行済みです');d.settings={...d.settings,date:EVENT_DATE,price,roomLimit,duration,open:false,slots}});setAlert('設定を保存しました。受付はまだ停止中です。')}catch(e){setAlert(e.message,'error')}
  }
  function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
  function exportCsv(){const header=['番号','開始','参加人数','同伴人数','小学生以下','状態','単価','請求額','入金方法','入金額','返金確認','発行日時'];const rows=data.tickets.map(t=>{const slot=data.settings.slots.find(x=>x.id===t.slotId);return [t.code,slot.time,t.participants,t.guardians,t.children?'はい':'いいえ',label(t),t.unitPrice,t.unitPrice*t.participants,t.payment?.method||'',t.payment?.amount||0,t.payment?.refundAt||'',t.createdAt]});const q=v=>`"${String(v).replaceAll('"','""')}"`;download(`稲門祭iPad受付_${EVENT_DATE}.csv`,'\ufeff'+[header,...rows].map(row=>row.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
  async function restore(){touchAdmin();const file=$('restore-file')?.files?.[0];if(!file)return setAlert('JSONファイルを選択してください','error');let next;try{next=valid(JSON.parse(await file.text()))}catch(e){setAlert(`復元ファイルが不正です：${e.message}`,'error');return}if(!confirm(`現在の ${data.tickets.length} 件を、ファイル内の ${next.tickets.length} 件に置き換えますか？\n現在の記録は戻せません。`))return;try{next.revision=data.revision+1;next.settings.open=false;save(next);adminActive=false;guestReset();setAlert('復元しました。PINで再ログインして内容を確認してください')}catch(e){setAlert(`復元できませんでした：${e.message}`,'error')}}
  $('guest').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.select){selected=b.dataset.select;participants=1;children=false;guardians=0;safetyAcknowledged=false;renderGuest();document.getElementById('guest-form')?.scrollIntoView({behavior:'smooth'})}else if(b.dataset.people){participants=Number(b.dataset.people);renderGuest();document.getElementById('guest-form')?.scrollIntoView({block:'nearest'})}else if(b.id==='cancel-choice'){selected=null;safetyAcknowledged=false;renderGuest()}else if(b.id==='reserve')book()});
  $('guest').addEventListener('change',e=>{if(e.target.id==='children'){children=e.target.checked;guardians=children?1:0;renderGuest()}else if(e.target.id==='guardian-count'){guardians=Number(e.target.value);renderGuest()}else if(e.target.id==='safety-check'){safetyAcknowledged=e.target.checked}});
  $('ticket').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='extend'){ticketDeadline=Math.min(ticketDeadline+30000,Date.now()+120000);renderTicket()}else if(b.id==='ticket-done')guestReset()});
  $('admin-entry').addEventListener('click',()=>{clearAlert();show('login')});
  $('login').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='pin-submit')doLogin();else if(b.id==='login-cancel')guestReset()});
  $('login').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doLogin()}});
  $('admin').addEventListener('submit',e=>{if(e.target.id==='settings-form')saveSettings(e)});
  $('admin').addEventListener('click',e=>{touchAdmin();const b=e.target.closest('button');if(!b)return;if(b.dataset.action)return adminAction(b.dataset.action,b.dataset.code);try{if(b.id==='admin-exit'){adminActive=false;guestReset()}else if(b.id==='toggle-intake'){update(d=>{if(!d.pin||d.settings.price===null||d.settings.roomLimit===null||d.settings.duration===null)throw Error('PIN・料金・在室上限・所要時間を設定してください');d.settings.open=!d.settings.open});setAlert(data.settings.open?'受付を開始しました':'受付を停止しました')}else if(b.id==='export-json'){download(`稲門祭iPad受付_${EVENT_DATE}.json`,JSON.stringify(data,null,2),'application/json');setAlert('JSONの保存先を確認し、別端末にも控えてください')}else if(b.id==='export-csv'){exportCsv();setAlert('CSVを保存しました')}else if(b.id==='change-pin'){changePin()}else if(b.id==='restore'){restore()}}catch(err){setAlert(err.message,'error')}});
  window.addEventListener('storage',e=>{if(e.key===KEY){try{data=read();storageReady=true;adminActive=false;guestReset();setAlert('記録が別画面で変わりました。内容を確認してください')}catch(err){storageReady=false;guestReset();setAlert('記録を読み込めません。受付を止めました','error')}}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='admin'){adminActive=false;guestReset()}else if(!document.hidden&&screen==='guest')renderGuest()});
  document.addEventListener('pointerdown',()=>{if(screen==='admin')touchAdmin()});
  setInterval(()=>{if(screen==='admin'&&Date.now()-adminLast>90000){adminActive=false;guestReset();setAlert('管理画面を自動で閉じました')}} ,5000);
  setInterval(()=>{if(screen==='guest')renderGuest()},30000);
  init();
  if(location.protocol==='https:'&&'serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script>
