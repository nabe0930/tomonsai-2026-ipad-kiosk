  .schedule-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 14px}.schedule-heading h2{margin:0;font-size:23px}.capacity-count{font-size:13px;color:var(--muted);white-space:nowrap}.capacity-count strong{font-size:18px;color:var(--ink);font-weight:650}.schedule{display:grid;gap:0;background:#fffdf9;border-top:1px solid var(--line)}.schedule .card{display:grid;grid-template-columns:1fr 1fr auto;align-items:center;gap:16px;padding:14px 22px;border:0;border-bottom:1px solid var(--line);background:transparent;border-radius:0}.schedule .card.selected{box-shadow:inset 3px 0 var(--accent);background:#f6ecee}.slot-time{display:flex;align-items:baseline;gap:12px}.card .time{font-size:30px;line-height:1.25;font-weight:600;letter-spacing:.025em;font-variant-numeric:tabular-nums}.slot-time small{font-size:12px;color:var(--muted)}.card .remain{font-size:15px;font-weight:500}.card .remain b{font-size:25px;line-height:1.3;font-weight:600;margin:0 4px;font-variant-numeric:tabular-nums}.slot-note{grid-column:1/-1;margin-top:-5px}.schedule button{min-width:160px;font-size:14px;padding:11px 16px;min-height:48px}.schedule button:disabled{opacity:1;background:#eeebe5;color:#928b81}.guest-help{font-size:13px;color:var(--muted);line-height:1.8;margin:21px 0 0;max-width:760px}
  .card{border:1px solid var(--line);border-radius:4px;background:#fffdf9;padding:24px}.card.selected{border-color:var(--accent)}#guest-form{margin-top:25px;border-top:3px solid var(--accent)}#guest-form h2{margin-top:0}
  button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:4px;background:var(--accent);color:#fff;font-weight:600;padding:13px 19px;min-height:48px;line-height:1.45}button:disabled{opacity:.42;cursor:not-allowed}button.secondary{background:#ece7df;color:var(--ink)}button.danger{background:var(--bad)}button.small{min-height:44px;padding:9px 13px;font-size:13px}button.ghost{background:transparent;color:inherit;border:1px solid currentColor}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bd9e56;outline-offset:3px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.field{display:block;margin:14px 0;font-weight:600;font-size:15px}.field input,.field select{display:block;width:100%;max-width:350px;margin-top:7px;padding:12px;border:1px solid #bfb7ac;border-radius:4px;background:#fffdf9;min-height:49px}.choice{display:flex;gap:10px;flex-wrap:wrap}.choice button{min-width:76px}.choice button.active{background:var(--accent);outline:2px solid #cdb7bd;outline-offset:3px}.check{display:flex;gap:12px;align-items:flex-start;font-size:15px;padding:15px;border:1px solid var(--line);background:#fffdf9}.check input{width:24px;height:24px;flex:none;margin-top:1px;accent-color:var(--accent)}.summary{font-size:18px;font-weight:600;padding:18px;background:#eee6e5;border-radius:2px;margin:18px 0}
  .ticket{max-width:720px;margin:20px auto;background:#fffdf9;border:1px solid var(--line);border-top:5px solid var(--accent);padding:32px;text-align:center}.ticket h1{font-size:28px}.code{font-size:clamp(42px,9vw,70px);letter-spacing:.12em;font-weight:600;line-height:1.3;margin:28px 0;color:var(--accent);font-variant-numeric:tabular-nums}.ticket .when{font-size:clamp(23px,4vw,30px);font-weight:600}.ticket .banner{text-align:left}.ticket p{font-size:14px}
  footer{max-width:1000px;margin:auto;padding:19px 28px 25px;color:var(--muted);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:12px}footer button.secondary{background:transparent;color:var(--muted);border:1px solid var(--line);white-space:nowrap}
  table{border-collapse:collapse;width:100%;font-size:13px;background:#fffdf9}th,td{border-bottom:1px solid var(--line);padding:12px;text-align:left;vertical-align:top}th{background:#ece7df;font-weight:600}.scroll{overflow-x:auto}.actions{display:flex;gap:6px;flex-wrap:wrap;min-width:230px}.adminstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.stat{background:#fffdf9;border:1px solid var(--line);padding:13px}.stat b{display:block;font-size:24px;font-weight:600}.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.hidden{display:none!important}
  .qr-image{display:block;max-width:min(300px,100%);max-height:360px;object-fit:contain;background:#fff;border:1px solid var(--line);padding:8px;margin:10px 0}.qr-placeholder{border:1px dashed #bfb7ac;background:#fffdf9;padding:24px;max-width:340px;text-align:center}
  @media(max-width:600px){header{padding:18px 20px 15px}header strong{font-size:14px}header small{font-size:11px}main{padding:25px 20px 40px}.guest-hero{gap:12px;padding-top:0}.guest-hero h1{font-size:31px}.hero-copy{font-size:13px}.workshop-facts{padding:15px 0;margin-bottom:20px}.fact{padding:0 13px}.fact-value{font-size:20px}.fact-value small{font-size:11px}.schedule-heading{align-items:flex-start;flex-direction:column;gap:5px}.schedule-heading h2{font-size:21px}.schedule .card{padding:17px 15px;grid-template-columns:1fr 1fr;gap:12px}.schedule button{grid-column:1/-1;width:100%;min-height:44px}.slot-time{gap:8px}.card .time{font-size:27px}.slot-availability{text-align:right}.slot-note{margin-top:0}.card{padding:20px}.ticket{padding:23px 17px}.code{letter-spacing:.06em}footer{padding:17px 20px}.actions{min-width:180px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style>
<style>
  .practice-bar{background:#eee6d5;color:#584522;border-bottom:1px solid #c4ad7c;padding:13px max(24px,calc((100vw - 1000px)/2 + 28px));display:flex;justify-content:space-between;align-items:center;gap:18px;font-size:14px;line-height:1.6}
  .practice-bar strong{display:block;font-size:17px}.practice-bar span,.practice-bar small{display:block}.practice-bar small{font-size:13px}.practice-bar a{color:inherit;white-space:nowrap;min-height:44px;padding:10px 12px;border:1px solid #b49b68;border-radius:4px;text-decoration:none;font-weight:600}

  @media(max-width:600px){.practice-bar{padding:12px 20px;align-items:flex-start;gap:10px;font-size:12px}.practice-bar small{font-size:12px}.practice-bar a{font-size:12px}}

<body>
<div id="practice-bar" class="hidden"></div>
<header><strong><span class="brand-dot" aria-hidden="true"></span>稲門祭 2026</strong><small>8号館 B105</small></header>
<main>
  <div id="alert" role="alert" class="hidden"></div>
  <section id="guest"></section>
  <section id="ticket" class="hidden"></section>
  <section id="login" class="hidden"></section>
  <section id="admin" class="hidden"></section>
</main>
<footer><span>操作に困ったときは、スタッフにお声がけください。<small class="app-version">受付アプリ v9</small></span><button id="admin-entry" class="secondary small" type="button">運営者用</button></footer>
<script>
(() => {
  'use strict';
  const TEST_MODE=new URLSearchParams(location.search).get('mode')==='test';
  const ask=message=>window.confirm(TEST_MODE?`【練習】実際の支払い・返金は不要です。\n\n${message}`:message);
  const KEY=TEST_MODE?'tomonsai-2026-ipad-kiosk-test-v1':'tomonsai-2026-ipad-kiosk-v1';
  const QR_DB=TEST_MODE?'tomonsai-2026-paypay-qr-test-v1':'tomonsai-2026-paypay-qr-device-v1';
  const QR_STORE='images';
  const QR_ID='official-merchant-qr';
  const QR_MAX_BYTES=2*1024*1024;
  const localDay=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const exportName=ext=>`稲門祭iPad受付_${TEST_MODE?'練習_':''}${localDay()}.${ext}`;
  const DURATION=20;
  const DAY_CAP=20;
  const PRICE=1000;
  const PAYPAY_CHECK_KEYS=['merchant','venue','paperQr','pfb'];
  const TIMES=['10:45','11:30','13:00','13:45','14:30'];
  const ALPHABET='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  const $=id=>document.getElementById(id);
  const esc=x=>String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
  const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n);
  const stamp=()=>new Date().toISOString();
  const minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3));
  const defaultData=()=>({version:1,purpose:TEST_MODE?'test':'live',revision:0,nextTicketNumber:1,pin:TEST_MODE?{salt:'00000000000000000000000000000000',hash:'44dec39e77e89b6a807177b97401f4c0240f39e4b2c658b45f45259583143414'}:null,settings:{date:localDay(),price:PRICE,duration:DURATION,open:TEST_MODE,paypayEnabled:false,paypayChecks:{merchant:false,venue:false,paperQr:false,pfb:false},slots:TIMES.map((time,i)=>({id:String(i+1),time,capacity:4}))},tickets:[]});
  let data=null,storageReady=false,screen='guest',selected=null,participants=1,safetyAcknowledged=false,bookingBusy=false,cashBusy=false,adminActive=false,adminLast=0,shownTicket=null,ticketDeadline=0,ticketTimer=null,loginFails=0,loginLockedUntil=0,qrBusy=false,qrPreviewUrl=null,qrRenderToken=0;
  function valid(d){
    if(TEST_MODE?d?.purpose!=='test':d?.purpose!==undefined&&d.purpose!=='live')throw Error('練習用と本番用の記録は相互に復元できません');
    if(!d||d.version!==1||!Number.isInteger(d.revision)||d.revision<0||!(d.pin===null||d.pin&&/^[0-9a-f]{32}$/.test(d.pin.salt)&&/^[0-9a-f]{64}$/.test(d.pin.hash)))throw Error('保存形式が不正です');
    if(!(d.nextTicketNumber===undefined||Number.isInteger(d.nextTicketNumber)&&d.nextTicketNumber>=1&&d.nextTicketNumber<=100000000))throw Error('受付番号の設定が不正です');
    const s=d.settings;if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s.date)||Number.isNaN(Date.parse(`${s.date}T00:00:00Z`))||new Date(`${s.date}T00:00:00Z`).toISOString().slice(0,10)!==s.date||!(s.price===null||Number.isInteger(s.price)&&s.price>=0&&s.price<=100000)||!(s.roomLimit===undefined||s.roomLimit===null||Number.isInteger(s.roomLimit)&&s.roomLimit>=1&&s.roomLimit<=30)||!(s.duration===null||Number.isInteger(s.duration)&&s.duration>=5&&s.duration<=120)||typeof s.open!=='boolean'||!Array.isArray(s.slots)||s.slots.length!==5)throw Error('設定が不正です');
    if(!(s.paypayEnabled===undefined||typeof s.paypayEnabled==='boolean')||!(s.paypayChecks===undefined||s.paypayChecks&&PAYPAY_CHECK_KEYS.every(k=>typeof s.paypayChecks[k]==='boolean'))||s.paypayEnabled===true&&(s.price!==1000||!PAYPAY_CHECK_KEYS.every(k=>s.paypayChecks?.[k]===true)))throw Error('PayPay設定が不正です');
    const seenTime=new Set();for(let i=0;i<5;i++){const x=s.slots[i];if(!x||x.id!==String(i+1)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(x.time)||seenTime.has(x.time)||!Number.isInteger(x.capacity)||x.capacity<1||x.capacity>30)throw Error('枠設定が不正です');seenTime.add(x.time)}
    if(!Array.isArray(d.tickets)||d.tickets.length>3000)throw Error('記録数が不正です');const codes=new Set(),transactions=new Set();for(const t of d.tickets){if(!t||!Array.from({length:5},(_,i)=>String(i+1)).includes(t.slotId)||typeof t.code!=='string'||!(/^\d{3,8}$/.test(t.code)||new RegExp(`^[${ALPHABET}]{8}$`).test(t.code))||codes.has(t.code)||!Number.isInteger(t.participants)||t.participants<1||t.participants>30||!(t.guardians===undefined||Number.isInteger(t.guardians)&&t.guardians>=0&&t.guardians<=30)||!(t.children===undefined||typeof t.children==='boolean')||!['pending_paypay','reserved','seated','completed','cancelled'].includes(t.status)||!Number.isInteger(t.unitPrice)||t.unitPrice<0||t.unitPrice>100000||typeof t.createdAt!=='string'||!Number.isFinite(Date.parse(t.createdAt))||!(t.payment===null||t.payment&&['cash','qr','paypay'].includes(t.payment.method)&&Number.isInteger(t.payment.amount)&&t.payment.amount>=0&&typeof t.payment.at==='string'&&Number.isFinite(Date.parse(t.payment.at))&&(t.payment.refundAt===null||typeof t.payment.refundAt==='string'&&Number.isFinite(Date.parse(t.payment.refundAt))))||t.payment?.method==='paypay'&&(!/^\d{20}$/.test(t.payment.transactionId)||t.payment.amount!==t.unitPrice*t.participants)||!(t.paymentIntent===undefined||t.paymentIntent==='paypay')||t.payment?.method==='paypay'&&t.paymentIntent!=='paypay'||t.paymentIntent==='paypay'&&['reserved','seated','completed'].includes(t.status)&&t.payment?.method!=='paypay'||t.status==='pending_paypay'&&(t.payment!==null||t.unitPrice!==1000||t.paymentIntent!=='paypay')){throw Error('番号札データが不正です')}if(t.payment?.method==='paypay'){if(transactions.has(t.payment.transactionId))throw Error('PayPay取引番号が重複しています');transactions.add(t.payment.transactionId)}codes.add(t.code)}
    if((s.open||d.tickets.length)&&(s.price===null||s.duration===null||d.pin===null))throw Error('受付条件が不正です');
    if(s.duration!==null&&s.slots.some((x,i)=>minutes(x.time)<605||minutes(x.time)+s.duration>950||(i>0&&minutes(x.time)<minutes(s.slots[i-1].time)+s.duration+10)))throw Error('枠間隔が不正です');
    for(const slot of s.slots){const active=d.tickets.filter(t=>t.slotId===slot.id&&t.status!=='cancelled');if(active.reduce((n,t)=>n+t.participants,0)>slot.capacity)throw Error('復元ファイルが定員を超えます')}
    return d;
  }
  // Old random codes can be eight digits. Only short numeric receipts seed the new sequence.
  function nextNumber(d){return Math.max(d.nextTicketNumber??1,1,...d.tickets.filter(t=>/^\d{3,7}$/.test(t.code)).map(t=>Number(t.code)+1))}
  function normalize(d){let changed=false;const number=nextNumber(d);if(d.nextTicketNumber!==number){d.nextTicketNumber=number;changed=true}if(d.settings.price!==PRICE){d.settings.price=PRICE;d.settings.open=false;d.settings.paypayEnabled=false;changed=true}if(d.settings.duration!==DURATION){d.settings.duration=DURATION;changed=true}if(d.settings.slots.every(x=>x.capacity===3)){for(const x of d.settings.slots)x.capacity=4;changed=true}if(d.settings.paypayEnabled===undefined){d.settings.paypayEnabled=false;changed=true}if(d.settings.paypayChecks===undefined){d.settings.paypayChecks={merchant:false,venue:false,paperQr:false,pfb:false};changed=true}return changed}
  function read(){const raw=localStorage.getItem(KEY),next=valid(raw?JSON.parse(raw):defaultData());if(raw&&normalize(next)){next.revision++;save(next)}return next}
  function save(next){valid(next);const raw=JSON.stringify(next);localStorage.setItem(KEY,raw);if(localStorage.getItem(KEY)!==raw)throw Error('保存を確認できません');data=next;storageReady=true}
  function init(){try{data=read();if(!localStorage.getItem(KEY))save(data);else storageReady=true}catch(e){storageReady=false;data=defaultData();setAlert('受付記録を読み込めません。新規受付を止めました。端末内の保存状態を確認してください。','error')}render()}
  function update(fn){if(!storageReady)throw Error('保存が使えません');const fresh=read();if(fresh.revision!==data.revision){data=fresh;render();throw Error('別画面で記録が更新されました。内容を確認してやり直してください')};const next=structuredClone(fresh);fn(next);next.revision++;save(next);render()}
  function setAlert(message,kind='notice'){const a=$('alert');a.className=kind==='error'?'notice error':'notice';a.textContent=message;a.scrollIntoView({block:'nearest'})}
  function clearAlert(){$('alert').className='hidden';$('alert').textContent=''}
  function show(which){if(which!=='admin')clearQrPreview();screen=which;for(const id of ['guest','ticket','login','admin'])$(id).classList.toggle('hidden',id!==which);$('admin-entry').classList.toggle('hidden',which==='admin'||which==='ticket'||which==='login');render()}
  function activeCount(slotId){return data.tickets.filter(t=>t.slotId===slotId&&t.status!=='cancelled')}
  function seatsUsed(slotId){return activeCount(slotId).reduce((n,t)=>n+t.participants,0)}
  function dayUsed(d=data){return d.tickets.filter(t=>t.status!=='cancelled').reduce((n,t)=>n+t.participants,0)}
  function dayRemaining(d=data){return Math.max(0,DAY_CAP-dayUsed(d))}
  function reason(slot){if(!storageReady)return '保存を確認できません';const s=data.settings;if(!s.open)return '受付停止中';if(s.price===null||!data.pin)return '運営設定が未完了';if(dayRemaining()===0)return '本日の参加定員20名に達しました';return null}
  function bookingOkFor(d,slot,p){if(!slot)throw Error('枠が見つかりません');if(!storageReady||!d.settings.open||d.settings.price===null||!d.pin)throw Error('受付停止中です');if(!Number.isInteger(p)||p<1||p>4||p>slot.capacity)throw Error('参加人数を確認してください');const active=d.tickets.filter(t=>t.slotId===slot.id&&t.status!=='cancelled');if(dayUsed(d)+p>DAY_CAP)throw Error('本日の参加定員20名を超えます');if(active.reduce((n,t)=>n+t.participants,0)+p>slot.capacity)throw Error('参加枠が満席です')}
  function makeSalt(){if(!crypto?.getRandomValues)throw Error('安全なPIN設定ができません');const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')}
  async function hashPin(pin,salt){if(!crypto?.subtle)throw Error('この環境ではPIN保護を使えません。HTTPSで開いてください');const bytes=new TextEncoder().encode(`${salt}:${pin}`);const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('')}
  function makeCode(d){let number=nextNumber(d);while(number<=99999999){const code=String(number).padStart(3,'0');if(!d.tickets.some(t=>t.code===code)){d.nextTicketNumber=number+1;return code}number++}throw Error('受付番号の上限に達しました')}
  function renderGuest(){const s=data.settings;const daily=dayRemaining();const closed=!s.open||!storageReady;const top=closed?'<div class="banner">ただいま新規受付を停止しています。スタッフにお声がけください。</div>':'<div class="banner">時間と人数を選び、予約番号を発行してください。お支払いは参加前にスタッフへ。</div>';
    const cards=s.slots.map(slot=>{const used=seatsUsed(slot.id),rem=Math.max(0,Math.min(slot.capacity-used,daily));const why=reason(slot);const disabled=!!why||rem===0;const label=disabled?'受付不可':'予約する';const note=why;return `<div class="card ${selected===slot.id?'selected':''}"><div class="slot-time"><span class="time">${esc(slot.time)}</span><small>開始</small></div><div class="slot-availability"><div class="remain">残り <b>${rem}</b> 名</div></div><button type="button" data-select="${slot.id}" ${disabled?'disabled':''}>${label}</button>${note?`<div class="slot-note tiny muted">${esc(note)}</div>`:''}</div>`}).join('');

  function guestReset(){clearAlert();shownTicket=null;selected=null;participants=1;safetyAcknowledged=false;clearInterval(ticketTimer);ticketTimer=null;show('guest')}
  function startTicket(t){shownTicket=t;ticketDeadline=Date.now()+60000;show('ticket');clearInterval(ticketTimer);ticketTimer=setInterval(()=>{if(screen!=='ticket')return;const n=Math.max(0,Math.ceil((ticketDeadline-Date.now())/1000));const el=$('countdown');if(el)el.textContent=n;if(n===0)guestReset()},250)}
  function book(){
    if(bookingBusy)return;
    const slot=data.settings.slots.find(x=>x.id===selected),p=participants;
    if(!safetyAcknowledged){setAlert('注意事項を確認してください','error');return}
    try{bookingOkFor(data,slot,p)}catch(e){setAlert(e.message,'error');return}
    if(!ask(`${slot.time} 開始・所要 ${DURATION}分\n体験 ${p}名\n参加料金 ${yen(data.settings.price*p)}\n\n予約番号を発行しますか？ お支払いは参加前にスタッフへお願いします。`))return;
    bookingBusy=true;renderGuest();let code=null,issued;
    try{
      update(d=>{
        const freshSlot=d.settings.slots.find(x=>x.id===slot.id);bookingOkFor(d,freshSlot,p);
        code=makeCode(d);
        if(d.tickets.some(t=>t.code===code))throw Error('番号が重複しました');
        issued={code,slotId:slot.id,participants:p,status:'reserved',unitPrice:d.settings.price,createdAt:stamp(),payment:null};
        d.tickets.push(issued);
      });
      clearAlert();startTicket(issued);
    }catch(e){
      let saved=null;
      try{saved=JSON.parse(localStorage.getItem(KEY)).tickets.find(t=>t.code===code&&t.status==='reserved'&&t.payment===null&&!t.paymentIntent)}catch{}
      if(saved){data=read();startTicket(saved);setAlert('予約番号は保存されています。二重に発行しないでください')}
      else setAlert(`予約できませんでした：${e.message}`,'error');
    }finally{bookingBusy=false}
  }

  function paypayTransactionId(code,amount){const id=prompt(`${code}：PayPay for Businessで正しい店舗の「取引完了」、金額 ${yen(amount)} を確認してください。画面上の20桁の取引番号を入力します。\n来場者の支払画面だけで判断しないでください。`);if(id===null)return null;if(!/^\d{20}$/.test(id))throw Error('PayPay取引番号は20桁の数字です');return id}
  function recordPaypay(code,id,late){update(d=>{const x=d.tickets.find(y=>y.code===code);if(!x||x.payment||x.paymentIntent!=='paypay'||(late?x.status!=='cancelled':x.status!=='pending_paypay'))throw Error('この番号はPayPay確認待ちではありません');if(d.tickets.some(y=>y.payment?.method==='paypay'&&y.payment.transactionId===id))throw Error('同じPayPay取引番号が既に記録されています');const amount=x.unitPrice*x.participants;if(x.unitPrice!==1000)throw Error('PayPay金額の設定が不正です');x.payment={method:'paypay',amount,at:stamp(),refundAt:null,transactionId:id};if(!late)x.status='reserved'})}
  function adminAction(action,code){touchAdmin();const t=data.tickets.find(x=>x.code===code);if(!t)return setAlert('番号札が見つかりません','error');try{if(action==='confirm-paypay'||action==='late-paypay'){const late=action==='late-paypay';if(t.payment||t.paymentIntent!=='paypay'||(late?t.status!=='cancelled':t.status!=='pending_paypay'))return setAlert('PayPay取引確認の対象外です','error');const amount=t.unitPrice*t.participants,id=paypayTransactionId(code,amount);if(id===null)return;if(!ask(`${code}：PayPay for Businessで「取引完了」、正しい店舗、金額 ${yen(amount)}、取引番号 ${id} の一致を確認しましたか？\n${late?'取消済みのため返金要確認として記録します。':'確認後に予約確定として記録します。'} この操作は決済・返金を実行しません。`))return;recordPaypay(code,id,late);setAlert(late?`${code} の後着決済を記録しました。実際の返金を確認してください`:`${code} のPayPay取引を確認し、予約を確定しました`);return}let message='';if(action==='pay-cash'){if(t.payment||t.status!=='reserved'||t.unitPrice<=0)return;const amount=t.unitPrice*t.participants;message=`${code}：実際に ${yen(amount)} の現金入金を確認しましたか？\nこの操作は決済を実行しません。`}else if(action==='seat')message=`${code}：支払い・保護者同伴・安全説明を対面で確認し、着席を記録しますか？`;else if(action==='complete')message=`${code}：体験完了を記録しますか？`;else if(action==='cancel')message=t.status==='pending_paypay'?`${code}：PayPay for Businessでこの番号に対応する取引が未成立であることを確認しましたか？\n支払確認待ちの枠を取消し、空席へ戻します。入金後に気づいた場合は後着決済を記録して返金してください。`:`${code}：番号札を取消しますか？${t.payment?'\n入金記録は残り、返金要確認になります。':''}`;else if(action==='refund')message=`${code}：実際の返金を完了したことを確認しましたか？\nこの操作は返金を実行しません。`;if(!message||!ask(message))return;update(d=>{const x=d.tickets.find(y=>y.code===code);if(!x)throw Error('番号が見つかりません');if(action==='pay-cash'){if(x.status!=='reserved'||x.payment||x.unitPrice<=0)throw Error('入金済みか操作不能です');x.payment={method:'cash',amount:x.unitPrice*x.participants,at:stamp(),refundAt:null}}else if(action==='seat'){if(x.status!=='reserved'||!(x.payment||x.unitPrice===0))throw Error('入金未確認です');x.status='seated'}else if(action==='complete'){if(x.status!=='seated')throw Error('着席確認前です');x.status='completed'}else if(action==='cancel'){if(!['pending_paypay','reserved','seated'].includes(x.status))throw Error('取消できません');x.status='cancelled'}else if(action==='refund'){if(x.status!=='cancelled'||!x.payment||x.payment.refundAt)throw Error('返金待ちではありません');x.payment.refundAt=stamp()}});setAlert(`${code} の記録を更新しました`)}catch(e){setAlert(e.message,'error')}}
  function savePaypay(ev){ev.preventDefault();touchAdmin();const f=new FormData(ev.target),checks=Object.fromEntries(PAYPAY_CHECK_KEYS.map(k=>[k,f.has(k)])),enabled=f.has('paypayEnabled');if(enabled&&(data.settings.price!==1000||!PAYPAY_CHECK_KEYS.every(k=>checks[k])))return setAlert('単価1,000円と加盟店契約・会場承認・紙QR・PayPay for Businessの4項目を確認してください','error');try{update(d=>{if(enabled&&d.settings.price!==1000)throw Error('料金が1,000円ではありません');d.settings.paypayChecks=checks;d.settings.paypayEnabled=enabled});setAlert(enabled?'PayPayの準備状況を保存しました':'PayPayの利用設定を停止しました')}catch(e){setAlert(e.message,'error')}}
  function cashRegister(ev){
    ev.preventDefault();touchAdmin();if(cashBusy)return;
    if(!adminActive||screen!=='admin')return setAlert('運営者画面で操作してください','error');
    const f=new FormData(ev.target),slotId=String(f.get('slotId')||''),p=Number(f.get('participants'));
    if(!f.has('cashReceived'))return setAlert('現金を実際に受領し、金額を確認してから登録してください','error');
    if(!Number.isInteger(p)||p<1||p>4)return setAlert('参加人数を確認してください','error');
    cashBusy=true;let code=null;
    try{
      const fresh=read();if(fresh.revision!==data.revision){data=fresh;render();throw Error('別画面で記録が更新されました。残席を確認してやり直してください')}
      const slot=fresh.settings.slots.find(x=>x.id===slotId);bookingOkFor(fresh,slot,p);
      if(fresh.settings.price!==PRICE)throw Error('料金設定が1人1,000円と一致しません');
      const amount=PRICE*p;
      if(!ask(`${slot.time} 開始・所要 ${DURATION}分\n体験 ${p}名\n現金 ${yen(amount)} を実際に受領しましたか？\n\n残席を再確認して支払済み番号を発行します。`))return;
      update(d=>{const currentSlot=d.settings.slots.find(x=>x.id===slotId);bookingOkFor(d,currentSlot,p);if(d.settings.price!==PRICE)throw Error('料金が変わりました');code=makeCode(d);if(d.tickets.some(t=>t.code===code))throw Error('番号が重複しました');const at=stamp();d.tickets.push({code,slotId,participants:p,status:'reserved',unitPrice:PRICE,createdAt:at,payment:{method:'cash',amount:PRICE*p,at,refundAt:null}})});
      setAlert(`${code}：現金 ${yen(amount)} の受領と受付を記録しました。番号を参加者へお伝えください。`);
    }catch(e){
      let saved=false;try{const current=JSON.parse(localStorage.getItem(KEY));saved=!!code&&current.tickets.some(t=>t.code===code&&t.payment?.method==='cash')}catch{}
      if(saved){data=read();render();setAlert(`${code}：現金受付は保存されています。二重登録しないでください。`)}
      else setAlert(`現金受付を記録できませんでした：${e.message}。現金を受け取っていたら返金し、残席と記録を確認してください。`,'error');
    }finally{cashBusy=false}
  }
  function saveSettings(ev){
    ev.preventDefault();touchAdmin();if(data.tickets.length)return setAlert('番号札発行後は設定を変更できません','error');
    const f=new FormData(ev.target);
    const price=PRICE,duration=DURATION;
    const slots=Array.from({length:5},(_,i)=>({id:String(i+1),time:String(f.get(`time${i}`)||''),capacity:Number(f.get(`cap${i}`))}));
    const basic=Number.isInteger(price)&&price>=0&&price<=100000&&slots.every(x=>/^([01]\d|2[0-3]):[0-5]\d$/.test(x.time)&&Number.isInteger(x.capacity)&&x.capacity>=1&&x.capacity<=DAY_CAP);
    const timesOk=basic&&slots.every((x,i)=>minutes(x.time)>=605&&minutes(x.time)+duration<=950&&(i===0||minutes(x.time)>=minutes(slots[i-1].time)+duration+10));
    if(!basic||!timesOk){setAlert('枠を確認してください。枠は10:05～15:50内、所要時間と10分の入替を確保してください。','error');return}
    try{update(d=>{if(d.tickets.length)throw Error('番号札が発行済みです');d.settings={...d.settings,price,duration,open:false,slots}});setAlert('設定を保存しました。受付はまだ停止中です。')}catch(e){setAlert(e.message,'error')}
  }
  function openQrDb(){
    return new Promise((resolve,reject)=>{
      if(!window.indexedDB)return reject(Error('このブラウザでは画像保存を利用できません'));
      let req;try{req=indexedDB.open(QR_DB,1)}catch(e){return reject(Error('画像保存を開けません'))}
      req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(QR_STORE))req.result.createObjectStore(QR_STORE)};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(Error('画像保存を開けません'));
      req.onblocked=()=>reject(Error('別画面が画像保存を使用中です。閉じてやり直してください'));
    });
  }
  async function qrTransaction(mode,action){
    const db=await openQrDb();
    return new Promise((resolve,reject)=>{
      let result,done=false;
      const finish=(error)=>{if(done)return;done=true;db.close();error?reject(error):resolve(result)};
      let tx,req;try{tx=db.transaction(QR_STORE,mode);req=action(tx.objectStore(QR_STORE))}catch(e){db.close();reject(Error('画像保存を操作できません'));return}
      req.onsuccess=()=>{result=req.result};
      tx.oncomplete=()=>finish(null);
      tx.onerror=()=>finish(Error('画像保存の読み書きに失敗しました'));
      tx.onabort=()=>finish(Error('画像保存が中断されました'));
    });
  }
  async function readQr(){
    const row=await qrTransaction('readonly',store=>store.get(QR_ID));
    if(row===undefined)return null;
    if(!row||row.version!==1||!['image/png','image/jpeg'].includes(row.mime)||!(row.blob instanceof Blob)||row.blob.type!==row.mime||row.blob.size<1||row.blob.size>QR_MAX_BYTES||!Number.isInteger(row.width)||!Number.isInteger(row.height)||row.width<120||row.height<120||row.width>2048||row.height>2048)throw Error('保存されたQR画像が不正です。削除して登録し直してください');
    return row;
  }
  function clearQrPreview(){
    qrRenderToken++;
    const img=$('paypay-qr-preview');if(img)img.removeAttribute('src');
    if(qrPreviewUrl){URL.revokeObjectURL(qrPreviewUrl);qrPreviewUrl=null}
  }
  async function refreshQrAdmin(){
    const token=++qrRenderToken;
    if(qrPreviewUrl){URL.revokeObjectURL(qrPreviewUrl);qrPreviewUrl=null}
    try{
      const row=await readQr();
      if(token!==qrRenderToken||screen!=='admin'||!adminActive)return;
      $('paypay-qr-delete').disabled=!row||qrBusy;
      $('paypay-qr-file').disabled=qrBusy;
      $('paypay-qr-placeholder').classList.toggle('hidden',!!row);
      $('paypay-qr-preview').classList.toggle('hidden',!row);
      $('paypay-qr-status').textContent=row?`このiPadに保存済み：${row.mime==='image/png'?'PNG':'JPEG'}、${Math.ceil(row.blob.size/1024)} KB、${row.width} × ${row.height} px。来場者画面には非表示です。`:'未登録です。現金受付には影響しません。';
      if(row){qrPreviewUrl=URL.createObjectURL(row.blob);$('paypay-qr-preview').src=qrPreviewUrl}
    }catch(e){
      if(token!==qrRenderToken||screen!=='admin'||!adminActive)return;
      $('paypay-qr-status').textContent=e.message;
      $('paypay-qr-delete').disabled=false;
      $('paypay-qr-preview').classList.add('hidden');
    }
  }
  async function decodeQrImage(file){
    const url=URL.createObjectURL(file);
    try{return await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve({width:img.naturalWidth,height:img.naturalHeight});img.onerror=()=>reject(Error('画像を開けません。PNGまたはJPEGを選んでください'));img.src=url})}
    finally{URL.revokeObjectURL(url)}
  }
  async function authorizeQrUpload(){
    if(adminActive&&screen==='admin'&&Date.now()-adminLast<=90000)return;
    const pin=prompt('ファイル選択中に管理画面が閉じました。保存するには6桁の運営者PINを再入力してください。');
    if(pin===null)throw Error('PIN再確認を取り消したため、画像を保存していません');
    if(!/^\d{6}$/.test(pin)||!data.pin)throw Error('運営者PINが正しくありません。画像を保存していません');
    const current=read();
    if(await hashPin(pin,current.pin.salt)!==current.pin.hash)throw Error('運営者PINが正しくありません。画像を保存していません');
    data=current;adminActive=true;touchAdmin();show('admin');
  }
  async function uploadQr(file){
    if(qrBusy||!file)return;
    qrBusy=true;
    try{
      await authorizeQrUpload();
      if(!['image/png','image/jpeg'].includes(file.type)||file.size<1||file.size>QR_MAX_BYTES)throw Error('PNGまたはJPEGの2 MB以下の画像を選んでください');
      const bytes=new Uint8Array(await file.slice(0,12).arrayBuffer());
      const png=bytes.length>=8&&[137,80,78,71,13,10,26,10].every((x,i)=>bytes[i]===x);
      const jpeg=bytes.length>=3&&bytes[0]===255&&bytes[1]===216&&bytes[2]===255;
      const actual=png?'image/png':jpeg?'image/jpeg':null;
      if(actual!==file.type)throw Error('ファイルの内容がPNGまたはJPEGと一致しません');
      const dimensions=await decodeQrImage(file);
      if(dimensions.width<120||dimensions.height<120||dimensions.width>2048||dimensions.height>2048)throw Error('画像の縦横は120～2048 pxにしてください');
      if(!ask('このiPad内の公式QR画像を保存しますか？既存画像があれば差し替えます。来場者画面には表示されません。'))return;
      const row={version:1,mime:actual,blob:new Blob([file],{type:actual}),...dimensions,savedAt:stamp()};
      await qrTransaction('readwrite',store=>store.put(row,QR_ID));
      const saved=await readQr(),first=new Uint8Array(await file.arrayBuffer()),second=new Uint8Array(await saved.blob.arrayBuffer());
      if(first.length!==second.length||first.some((x,i)=>x!==second[i]))throw Error('画像の保存後確認に失敗しました。再登録してください');
      if(screen==='admin'&&adminActive)setAlert('公式QR画像をこのiPadに保存しました。来場者画面には表示されません。');
    }catch(e){setAlert(`QR画像を保存できませんでした：${e.message}`,'error')}
    finally{qrBusy=false;if(screen==='admin'&&adminActive)refreshQrAdmin()}
  }
  async function deleteQr(){
    if(qrBusy||!adminActive||screen!=='admin')return;
    if(!ask('このiPad内の公式QR画像を削除しますか？受付記録には影響しません。'))return;
    qrBusy=true;
    try{await qrTransaction('readwrite',store=>store.delete(QR_ID));if(await readQr()!==null)throw Error('削除後の確認に失敗しました');setAlert('このiPad内の公式QR画像を削除しました')}
    catch(e){setAlert(`QR画像を削除できませんでした：${e.message}`,'error')}
    finally{qrBusy=false;refreshQrAdmin()}
  }
  function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
  function exportCsv(){const header=['番号','開始','参加人数','状態','単価','請求額','支払予定','入金方法','入金額','PayPay取引番号','返金確認','発行日時'];const rows=data.tickets.map(t=>{const slot=data.settings.slots.find(x=>x.id===t.slotId);return [t.code,slot.time,t.participants,label(t),t.unitPrice,t.unitPrice*t.participants,t.paymentIntent||'',t.payment?.method||'',t.payment?.amount||0,t.payment?.transactionId||'',t.payment?.refundAt||'',t.createdAt]});const q=v=>`"${String(v).replaceAll('"','""')}"`;download(exportName('csv'),'\ufeff'+[header,...rows].map(row=>row.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
  async function restore(){touchAdmin();const file=$('restore-file')?.files?.[0];if(!file)return setAlert('JSONファイルを選択してください','error');let next;try{next=valid(JSON.parse(await file.text()));normalize(next);valid(next);if(dayUsed(next)>DAY_CAP)throw Error('当日の参加定員20名を超えています')}catch(e){setAlert(`復元ファイルが不正です：${e.message}`,'error');return}if(!ask(`現在の ${data.tickets.length} 件を、ファイル内の ${next.tickets.length} 件に置き換えますか？\n現在の記録は戻せません。`))return;try{const fresh=read();if(fresh.revision!==data.revision)throw Error('別画面で記録が更新されました。内容を確認してやり直してください');next.nextTicketNumber=Math.max(nextNumber(fresh),nextNumber(next));next.revision=fresh.revision+1;next.settings.open=false;next.settings.paypayEnabled=false;save(next);adminActive=false;guestReset();setAlert('復元しました。PINで再ログインして内容を確認してください')}catch(e){setAlert(`復元できませんでした：${e.message}`,'error')}}
  $('guest').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.select){selected=b.dataset.select;participants=1;safetyAcknowledged=false;renderGuest();document.getElementById('guest-form')?.scrollIntoView({behavior:'smooth'})}else if(b.dataset.people){participants=Number(b.dataset.people);renderGuest();document.getElementById('guest-form')?.scrollIntoView({block:'nearest'})}else if(b.id==='cancel-choice'){selected=null;safetyAcknowledged=false;renderGuest()}else if(b.id==='reserve')book()});
  $('guest').addEventListener('change',e=>{if(e.target.id==='safety-check'){safetyAcknowledged=e.target.checked}});
  $('ticket').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='extend'){ticketDeadline=Math.min(ticketDeadline+30000,Date.now()+120000);renderTicket()}else if(b.id==='ticket-done')guestReset()});
  $('admin-entry').addEventListener('click',()=>{clearAlert();show('login')});
  $('login').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='pin-submit')doLogin();else if(b.id==='login-cancel')guestReset()});
  $('login').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doLogin()}});
  $('admin').addEventListener('change',e=>{if(e.target.id==='paypay-qr-file'){const file=e.target.files?.[0];if(file)uploadQr(file)}});
  $('admin').addEventListener('submit',e=>{if(e.target.id==='settings-form')saveSettings(e);else if(e.target.id==='paypay-form')savePaypay(e);else if(e.target.id==='cash-form')cashRegister(e)});
  $('admin').addEventListener('click',e=>{touchAdmin();const b=e.target.closest('button');if(!b)return;if(b.dataset.action)return adminAction(b.dataset.action,b.dataset.code);try{if(b.id==='admin-exit'){adminActive=false;guestReset()}else if(b.id==='toggle-intake'){update(d=>{if(!d.pin||d.settings.price===null)throw Error('PIN・料金を設定してください');d.settings.open=!d.settings.open});setAlert(data.settings.open?'受付を開始しました':'受付を停止しました')}else if(b.id==='open-practice'){const url=new URL(location.href);url.searchParams.set('mode','test');location.assign(url.href)}else if(b.id==='reset-practice'){if(!TEST_MODE)throw Error('練習モードでのみ使えます');if(ask('練習用の受付記録を0件に戻しますか？\n本番の受付記録は変更されません。練習PINも000000に戻ります。')){update(d=>{const fresh=defaultData();Object.assign(d,fresh,{revision:d.revision})});setAlert('練習の受付記録をリセットしました')}}else if(b.id==='export-json'){download(exportName('json'),JSON.stringify(data,null,2),'application/json');setAlert('JSONの保存先を確認し、別端末にも控えてください')}else if(b.id==='export-csv'){exportCsv();setAlert('CSVを保存しました')}else if(b.id==='change-pin'){changePin()}else if(b.id==='restore'){restore()}else if(b.id==='paypay-qr-delete'){deleteQr()}}catch(err){setAlert(err.message,'error')}});
  window.addEventListener('storage',e=>{if(e.key===KEY){try{data=read();storageReady=true;adminActive=false;guestReset();setAlert('記録が別画面で変わりました。内容を確認してください')}catch(err){storageReady=false;guestReset();setAlert('記録を読み込めません。受付を止めました','error')}}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='admin'){adminActive=false;guestReset()}else if(!document.hidden&&screen==='guest')renderGuest()});
  document.addEventListener('pointerdown',()=>{if(screen==='admin')touchAdmin()});
  setInterval(()=>{if(screen==='admin'&&Date.now()-adminLast>90000){adminActive=false;guestReset();setAlert('管理画面を自動で閉じました')}} ,5000);
  setInterval(()=>{if(screen==='guest')renderGuest()},30000);
  if(TEST_MODE){
    document.body.classList.add('practice');
    document.title='練習用 · 稲門祭受付';
    const bar=$('practice-bar');bar.className='practice-bar';
    bar.innerHTML='<div><strong>練習モード</strong><span>本番の受付記録には入りません。実際の支払いは不要です。</span><small>来場者の予約を試せます。運営者用PIN：000000（練習のみ）</small></div><a id="practice-exit">本番に戻る</a>';
    const url=new URL(location.href);url.searchParams.delete('mode');$('practice-exit').href=url.href;
  }
  init();
  if(location.protocol==='https:'&&'serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
