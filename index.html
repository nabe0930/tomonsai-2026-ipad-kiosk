<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123e40">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<title>稲門祭2026 セルフ受付・試作</title>
<style>
  :root{color-scheme:light;--ink:#123e40;--muted:#50696a;--paper:#f5f6ee;--line:#c8d5d0;--accent:#006f73;--warn:#8f4300;--bad:#9d2626}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.5}
  header{background:var(--ink);color:#fff;padding:18px max(18px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px}
  header strong{font-size:clamp(20px,3vw,29px)}header small{font-size:14px;opacity:.9}main{max-width:1000px;margin:auto;padding:22px 18px 70px}
  h1{font-size:clamp(25px,4vw,38px);line-height:1.25;margin:10px 0 14px}h2{font-size:24px;margin:20px 0 12px}h3{font-size:19px;margin:0 0 10px}p{margin:8px 0 14px}
  .banner{border:2px solid #dfa05d;background:#fff4e8;color:#643000;padding:14px 16px;border-radius:12px;font-weight:700;margin:12px 0 18px}
  .notice{border:1px solid var(--line);background:#fff;padding:14px 16px;border-radius:12px;margin:12px 0}.error{border-color:#df9a9a;background:#fff2f2;color:#772020}
  .muted{color:var(--muted)}.tiny{font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  .card{border:2px solid var(--line);border-radius:16px;background:#fff;padding:18px}.card.selected{border-color:var(--accent);box-shadow:0 0 0 3px #006f7330}.card .time{font-size:31px;font-weight:800}.card .remain{font-size:18px;font-weight:700}
  button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:11px;background:var(--accent);color:#fff;font-weight:700;padding:13px 19px;min-height:50px}button:disabled{opacity:.42;cursor:not-allowed}button.secondary{background:#e7efeb;color:var(--ink)}button.danger{background:var(--bad)}button.small{min-height:36px;padding:7px 11px;font-size:14px}button.ghost{background:transparent;color:inherit;border:1px solid currentColor}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.field{display:block;margin:14px 0;font-weight:700}.field input,.field select{display:block;width:100%;max-width:350px;margin-top:6px;padding:12px;border:2px solid var(--line);border-radius:9px;background:#fff;min-height:49px}
  .choice{display:flex;gap:9px;flex-wrap:wrap}.choice button{min-width:76px}.choice button.active{background:var(--ink);outline:3px solid #bad8d4}.check{display:flex;gap:12px;align-items:flex-start;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.check input{width:24px;height:24px;flex:none;margin-top:2px}
  .summary{font-size:20px;font-weight:700;padding:17px;background:#e5f2ed;border-radius:12px;margin:16px 0}.ticket{max-width:720px;margin:20px auto;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:28px;text-align:center}.code{font-size:clamp(42px,9vw,77px);letter-spacing:.1em;font-weight:900;line-height:1.2;margin:20px 0}.ticket .when{font-size:clamp(24px,4vw,34px);font-weight:800}
  footer{max-width:1000px;margin:auto;padding:18px;color:var(--muted);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}th{background:#e7efeb}.scroll{overflow-x:auto}.actions{display:flex;gap:5px;flex-wrap:wrap;min-width:230px}.adminstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}.stat b{display:block;font-size:22px}
  .adminnav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.hidden{display:none!important}
  @media(max-width:600px){main{padding:14px 12px 60px}.card{padding:14px}header{padding:12px}header small{display:none}.ticket{padding:16px}.code{letter-spacing:.04em}footer{padding:12px}.actions{min-width:180px}}
</style>
</head>
<body>
<header><strong>透明標本づくり 受付</strong><small>稲門祭2026 · 8号館 B105</small></header>
<main>
  <div id="alert" role="alert" class="hidden"></div>
  <section id="guest"></section>
  <section id="ticket" class="hidden"></section>
  <section id="login" class="hidden"></section>
  <section id="admin" class="hidden"></section>
</main>
<footer><span>この端末での受付です。PayPay入金の照合と参加確認はスタッフが行います。</span><button id="admin-entry" class="secondary small" type="button">運営者用</button></footer>
<script>
(() => {
  'use strict';
  const KEY='tomonsai-2026-ipad-kiosk-v1';
  const EVENT_DATE='2026-10-18';
  const DURATION=20;
  const DAY_CAP=20;
  const PRICE=1000;
  const PAYPAY_CHECK_KEYS=['merchant','venue','paperQr','pfb'];
  const TIMES=['10:45','11:30','13:00','13:45','14:30'];
  const ALPHABET='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  const $=id=>document.getElementById(id);
  const esc=x=>String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
  const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n);
  const stamp=()=>new Date().toISOString();
  const minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3));
  const before5=t=>{const m=minutes(t)-5;return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`};
  const defaultData=()=>({version:1,revision:0,pin:null,settings:{date:EVENT_DATE,price:PRICE,roomLimit:null,duration:DURATION,open:false,paypayEnabled:false,paypayChecks:{merchant:false,venue:false,paperQr:false,pfb:false},slots:TIMES.map((time,i)=>({id:String(i+1),time,capacity:4}))},tickets:[]});
  let data=null,storageReady=false,screen='guest',selected=null,participants=1,children=false,guardians=0,safetyAcknowledged=false,bookingBusy=false,cashBusy=false,adminActive=false,adminLast=0,shownTicket=null,ticketDeadline=0,ticketTimer=null,loginFails=0,loginLockedUntil=0;
  function valid(d){
    if(!d||d.version!==1||!Number.isInteger(d.revision)||d.revision<0||!(d.pin===null||d.pin&&/^[0-9a-f]{32}$/.test(d.pin.salt)&&/^[0-9a-f]{64}$/.test(d.pin.hash)))throw Error('保存形式が不正です');
    const s=d.settings;if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s.date)||Number.isNaN(Date.parse(`${s.date}T00:00:00Z`))||new Date(`${s.date}T00:00:00Z`).toISOString().slice(0,10)!==s.date||!(s.price===null||Number.isInteger(s.price)&&s.price>=0&&s.price<=100000)||!(s.roomLimit===null||Number.isInteger(s.roomLimit)&&s.roomLimit>=1&&s.roomLimit<=30)||!(s.duration===null||Number.isInteger(s.duration)&&s.duration>=5&&s.duration<=120)||typeof s.open!=='boolean'||!Array.isArray(s.slots)||s.slots.length!==5)throw Error('設定が不正です');
    if(!(s.paypayEnabled===undefined||typeof s.paypayEnabled==='boolean')||!(s.paypayChecks===undefined||s.paypayChecks&&PAYPAY_CHECK_KEYS.every(k=>typeof s.paypayChecks[k]==='boolean'))||s.paypayEnabled===true&&(s.price!==1000||!PAYPAY_CHECK_KEYS.every(k=>s.paypayChecks?.[k]===true)))throw Error('PayPay設定が不正です');
    const seenTime=new Set();for(let i=0;i<5;i++){const x=s.slots[i];if(!x||x.id!==String(i+1)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(x.time)||seenTime.has(x.time)||!Number.isInteger(x.capacity)||x.capacity<1||x.capacity>30)throw Error('枠設定が不正です');seenTime.add(x.time)}
    if(!Array.isArray(d.tickets)||d.tickets.length>3000)throw Error('記録数が不正です');const codes=new Set(),transactions=new Set();for(const t of d.tickets){if(!t||!Array.from({length:5},(_,i)=>String(i+1)).includes(t.slotId)||!new RegExp(`^[${ALPHABET}]{8}$`).test(t.code)||codes.has(t.code)||!Number.isInteger(t.participants)||t.participants<1||t.participants>30||!Number.isInteger(t.guardians)||t.guardians<0||t.guardians>30||typeof t.children!=='boolean'||!['pending_paypay','reserved','seated','completed','cancelled'].includes(t.status)||!Number.isInteger(t.unitPrice)||t.unitPrice<0||t.unitPrice>100000||typeof t.createdAt!=='string'||!Number.isFinite(Date.parse(t.createdAt))||!(t.payment===null||t.payment&&['cash','qr','paypay'].includes(t.payment.method)&&Number.isInteger(t.payment.amount)&&t.payment.amount>=0&&typeof t.payment.at==='string'&&Number.isFinite(Date.parse(t.payment.at))&&(t.payment.refundAt===null||typeof t.payment.refundAt==='string'&&Number.isFinite(Date.parse(t.payment.refundAt))))||t.payment?.method==='paypay'&&(!/^\d{20}$/.test(t.payment.transactionId)||t.payment.amount!==t.unitPrice*t.participants)||!(t.paymentIntent===undefined||t.paymentIntent==='paypay')||t.payment?.method==='paypay'&&t.paymentIntent!=='paypay'||t.paymentIntent==='paypay'&&['reserved','seated','completed'].includes(t.status)&&t.payment?.method!=='paypay'||t.status==='pending_paypay'&&(t.payment!==null||t.unitPrice!==1000||t.paymentIntent!=='paypay')){throw Error('番号札データが不正です')}if(t.payment?.method==='paypay'){if(transactions.has(t.payment.transactionId))throw Error('PayPay取引番号が重複しています');transactions.add(t.payment.transactionId)}codes.add(t.code)}
    if((s.open||d.tickets.length)&&(s.price===null||s.roomLimit===null||s.duration===null||d.pin===null))throw Error('受付条件が不正です');
    if(s.duration!==null&&s.slots.some((x,i)=>minutes(x.time)<605||minutes(x.time)+s.duration>950||(i>0&&minutes(x.time)<minutes(s.slots[i-1].time)+s.duration+10)))throw Error('枠間隔が不正です');
    if(s.roomLimit!==null){for(const slot of s.slots){const active=d.tickets.filter(t=>t.slotId===slot.id&&t.status!=='cancelled');if(active.reduce((n,t)=>n+t.participants,0)>slot.capacity||active.reduce((n,t)=>n+t.participants+t.guardians,0)>s.roomLimit)throw Error('復元ファイルが定員を超えます')}}
    return d;
  }
  function normalize(d){let changed=false;if(d.settings.price!==PRICE){d.settings.price=PRICE;d.settings.open=false;d.settings.paypayEnabled=false;changed=true}if(d.settings.duration!==DURATION){d.settings.duration=DURATION;changed=true}if(d.settings.slots.every(x=>x.capacity===3)){for(const x of d.settings.slots)x.capacity=4;changed=true}if(d.settings.paypayEnabled===undefined){d.settings.paypayEnabled=false;changed=true}if(d.settings.paypayChecks===undefined){d.settings.paypayChecks={merchant:false,venue:false,paperQr:false,pfb:false};changed=true}return changed}
  function read(){const raw=localStorage.getItem(KEY),next=valid(raw?JSON.parse(raw):defaultData());if(raw&&normalize(next)){next.revision++;save(next)}return next}
  function save(next){valid(next);const raw=JSON.stringify(next);localStorage.setItem(KEY,raw);if(localStorage.getItem(KEY)!==raw)throw Error('保存を確認できません');data=next;storageReady=true}
  function init(){try{data=read();if(!localStorage.getItem(KEY))save(data);else storageReady=true}catch(e){storageReady=false;data=defaultData();setAlert('受付記録を読み込めません。新規受付を止めました。端末内の保存状態を確認してください。','error')}render()}
  function update(fn){if(!storageReady)throw Error('保存が使えません');const fresh=read();if(fresh.revision!==data.revision){data=fresh;render();throw Error('別画面で記録が更新されました。内容を確認してやり直してください')};const next=structuredClone(fresh);fn(next);next.revision++;save(next);render()}
  function setAlert(message,kind='notice'){const a=$('alert');a.className=kind==='error'?'notice error':'notice';a.textContent=message;a.scrollIntoView({block:'nearest'})}
  function clearAlert(){$('alert').className='hidden';$('alert').textContent=''}
  function show(which){screen=which;for(const id of ['guest','ticket','login','admin'])$(id).classList.toggle('hidden',id!==which);$('admin-entry').classList.toggle('hidden',which==='admin'||which==='ticket'||which==='login');render()}
  function activeCount(slotId){return data.tickets.filter(t=>t.slotId===slotId&&t.status!=='cancelled')}
  function roomUsed(slotId){return activeCount(slotId).reduce((n,t)=>n+t.participants+t.guardians,0)}
  function seatsUsed(slotId){return activeCount(slotId).reduce((n,t)=>n+t.participants,0)}
  function dayUsed(d=data){return d.tickets.filter(t=>t.status!=='cancelled').reduce((n,t)=>n+t.participants,0)}
  function dayRemaining(d=data){return Math.max(0,DAY_CAP-dayUsed(d))}
  function paypayReady(d){return d.settings.paypayEnabled===true&&d.settings.price===1000&&PAYPAY_CHECK_KEYS.every(k=>d.settings.paypayChecks?.[k]===true)}
  function bookingWindow(slot){const d=new Date();if(d.getHours()*60+d.getMinutes()>=minutes(slot.time)-10)return '受付終了';return null}
  function reason(slot){if(!storageReady)return '保存を確認できません';const s=data.settings;if(!s.open)return '受付停止中';if(s.price===null||s.roomLimit===null||!data.pin)return '運営設定が未完了';if(!paypayReady(data))return 'PayPay受付準備中';if(dayRemaining()===0)return '本日の参加定員20名に達しました';return bookingWindow(slot)}
  function bookingOkFor(d,slot,p,c,g){if(!slot)throw Error('枠が見つかりません');if(!storageReady||!d.settings.open||d.settings.price===null||d.settings.roomLimit===null||!d.pin)throw Error('受付停止中です');if(new Date().getHours()*60+new Date().getMinutes()>=minutes(slot.time)-10)throw Error('この枠の受付時間ではありません');if(!Number.isInteger(p)||p<1||p>slot.capacity||typeof c!=='boolean'||!Number.isInteger(g)||g<0||g>3||c&&g<1||!c&&g!==0)throw Error('人数と保護者を確認してください');const active=d.tickets.filter(t=>t.slotId===slot.id&&t.status!=='cancelled');if(dayUsed(d)+p>DAY_CAP)throw Error('本日の参加定員20名を超えます');if(active.reduce((n,t)=>n+t.participants,0)+p>slot.capacity)throw Error('参加枠が満席です');if(active.reduce((n,t)=>n+t.participants+t.guardians,0)+p+g>d.settings.roomLimit)throw Error('在室人数の上限を超えます')}
  function makeSalt(){if(!crypto?.getRandomValues)throw Error('安全なPIN設定ができません');const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')}
  async function hashPin(pin,salt){if(!crypto?.subtle)throw Error('この環境ではPIN保護を使えません。HTTPSで開いてください');const bytes=new TextEncoder().encode(`${salt}:${pin}`);const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('')}
  function makeCode(){if(!crypto?.getRandomValues)throw Error('安全な番号生成ができません');for(let tries=0;tries<20;tries++){const a=new Uint8Array(8);crypto.getRandomValues(a);const code=Array.from(a,x=>ALPHABET[x%ALPHABET.length]).join('');if(!data.tickets.some(t=>t.code===code))return code}throw Error('番号を生成できません')}
  function renderGuest(){const s=data.settings;const daily=dayRemaining();const closed=!s.open||!storageReady;const top=closed?'<div class="banner">ただいま新規受付を停止しています。スタッフにお声がけください。</div>':!paypayReady(data)?'<div class="banner">PayPay受付は準備中です。現金をご希望の場合は、空き枠についてスタッフにお声がけください。</div>':'';
    const cards=s.slots.map(slot=>{const used=seatsUsed(slot.id),room=roomUsed(slot.id),rem=Math.max(0,Math.min(slot.capacity-used,daily)),roomRem=s.roomLimit===null?'未設定':Math.max(0,s.roomLimit-room);const why=reason(slot);const disabled=!!why||rem===0||s.roomLimit!==null&&roomRem===0;const label=why||rem===0||roomRem===0?'受付不可':'この枠を選ぶ';return `<div class="card ${selected===slot.id?'selected':''}"><div class="time">${esc(slot.time)}</div><div class="tiny muted">所要 ${DURATION} 分</div><div class="remain">残り ${rem} 名</div><div class="muted tiny">付き添いを含む在室余裕：${esc(roomRem)} 名</div><button type="button" data-select="${slot.id}" ${disabled?'disabled':''}>${label}</button>${why?`<div class="tiny muted">${esc(why)}</div>`:''}</div>`}).join('');
    let form='';const slot=s.slots.find(x=>x.id===selected);if(slot&&!reason(slot)){const price=s.price===null?'未設定':yen(s.price);const available=Math.max(0,Math.min(4,slot.capacity-seatsUsed(slot.id),s.roomLimit-roomUsed(slot.id)-guardians,daily));if(available>0&&participants>available)participants=available;const guardianChoice=children?`<label class="field">見守りだけの保護者（体験しない方）<select id="guardian-count"><option value="1" ${guardians===1?'selected':''}>1名</option><option value="2" ${guardians===2?'selected':''}>2名</option><option value="3" ${guardians===3?'selected':''}>3名</option></select></label>`:'';const total=s.price===null?'未設定':yen(s.price*participants);form=`<div class="card" id="guest-form"><h2>${esc(slot.time)} の受付内容</h2><p>体験する人数を選択してください。見守りだけの保護者は参加人数に含めません。保護者も制作する場合は参加人数に含めてください。</p><div class="choice" role="group" aria-label="参加人数">${Array.from({length:available},(_,i)=>`<button type="button" class="${participants===i+1?'active':'secondary'}" data-people="${i+1}">${i+1}名</button>`).join('')}</div><label class="check" style="margin-top:18px"><input id="children" type="checkbox" ${children?'checked':''}><span>小学生以下の参加者がいる（保護者同伴が必要）</span></label>${guardianChoice}<div class="summary">${participants}名分 ${total} ／ 開始5分前の ${before5(slot.time)} までにスタッフへ</div><p class="muted">単価 ${price}。PayPayの支払いはご自身のスマートフォンで、会場に掲示された加盟店の紙QRコードから行ってください。このiPadにQRは表示しません。</p><div class="notice"><strong>体験時の注意</strong><br>標本やグリセリンを口に入れないでください。液体をこぼしたり容器を落としたりしたら、すぐスタッフに知らせてください。道具や封入作業はスタッフの説明に従ってください。小学生以下は保護者同伴です。</div><label class="check"><input id="safety-check" type="checkbox" ${safetyAcknowledged?'checked':''}><span>上の注意を読みました。参加前にスタッフから直接説明を受けます。</span></label><div class="row" style="margin-top:17px"><button type="button" id="reserve" ${bookingBusy||available<1?'disabled':''}>PayPay支払確認待ち番号を発行</button><button type="button" id="cancel-choice" class="secondary">枠選択に戻る</button></div></div>`}
    $('guest').innerHTML=`<h1>時間を選んでください</h1><p>8号館B105。PayPayを選ぶ方は、ここで支払確認待ち番号を発行します。<strong>予約確定はスタッフがPayPay for Businessで入金を確認した後です。</strong> 現金は当日先着で、空きがある場合のみスタッフが受付します。</p>${top}<div class="notice">当日参加者 ${dayUsed()} / ${DAY_CAP} 名（残り ${daily} 名）</div><div class="grid">${cards}</div>${form}<div class="notice tiny">${s.open?'このiPadの受付記録です。別の端末とは同期しません。PayPayはスタッフの入金確認後に予約確定します。番号を控えられない方は、予約前にスタッフへお声がけください。行けなくなった場合は番号をスタッフへ伝えてください。':'枠時刻・定員・料金が確定するまで受付は始まりません。'} 同じ受付ページを複数のタブで開かないでください。</div>`;
  }
  function renderTicket(){if(!shownTicket)return;const t=shownTicket;const slot=data.settings.slots.find(x=>x.id===t.slotId);const left=Math.max(0,Math.ceil((ticketDeadline-Date.now())/1000));$('ticket').innerHTML=`<div class="ticket"><h1>PayPay支払確認待ち</h1><p>この番号の発行だけでは予約は確定していません</p><div class="code">${esc(t.code)}</div><div class="when">${EVENT_DATE} ${esc(slot.time)} 開始 · 所要 ${DURATION} 分</div><p>参加 ${t.participants}名 ／ 付き添い ${t.guardians}名 ／ お支払い ${yen(t.unitPrice*t.participants)}</p><div class="banner">会場に掲示されたPayPay加盟店の紙QRコードを、ご自身のスマートフォンで読み取り、${yen(t.unitPrice*t.participants)}を支払ってください。支払後は ${before5(slot.time)} までにこの番号をスタッフへ伝えてください。スタッフがPayPay for Businessの「取引完了」と金額を確認してから予約が確定します。</div><p>支払済みの画面を見せるだけでは確定しません。決済が未完了なら枠は一時的に埋まったままです。スタッフに取消を申し出てください。二重払いに気づいた場合もスタッフへ知らせてください。</p><p>番号を写真に撮るか、用意された紙に控えてください。画面は <strong id="countdown">${left}</strong> 秒後に消えます。再表示が必要な場合はスタッフへ番号と枠時刻を伝えてください。</p><div class="row" style="justify-content:center"><button type="button" id="extend" class="secondary">表示を30秒延長</button><button type="button" id="ticket-done">控えました</button></div></div>`}

yChecks.pfb?'checked':''}><span>PayPay for Businessで取引を確認できる</span></label><label class="check"><input name="paypayEnabled" type="checkbox" ${s.paypayEnabled?'checked':''}><span>PayPayのセルフ受付を有効にする</span></label><button type="submit">PayPay設定を保存</button></form><h2>控えの復元</h2><div class="notice tiny">復元は現在の記録を丸ごと置き換えます。まずJSONを別端末に保存し、復元するファイルと時刻を確認してください。</div><input id="restore-file" type="file" accept="application/json,.json"><button type="button" id="restore" class="secondary">JSONから復元</button><p class="tiny muted">管理PINと端末内保存は強いセキュリティ対策ではありません。氏名・連絡先・カード情報は保存しません。現金/旧QR/PayPayの入金確認記録は端末に保存します。旧スタッフ用受付試作とは別台帳です。同時に使わないでください。</p>`;

  function paypayTransactionId(code,amount){const id=prompt(`${code}：PayPay for Businessで正しい店舗の「取引完了」、金額 ${yen(amount)} を確認してください。画面上の20桁の取引番号を入力します。\n来場者の支払画面だけで判断しないでください。`);if(id===null)return null;if(!/^\d{20}$/.test(id))throw Error('PayPay取引番号は20桁の数字です');return id}
  function recordPaypay(code,id,late){update(d=>{const x=d.tickets.find(y=>y.code===code);if(!x||x.payment||x.paymentIntent!=='paypay'||(late?x.status!=='cancelled':x.status!=='pending_paypay'))throw Error('この番号はPayPay確認待ちではありません');if(d.tickets.some(y=>y.payment?.method==='paypay'&&y.payment.transactionId===id))throw Error('同じPayPay取引番号が既に記録されています');const amount=x.unitPrice*x.participants;if(x.unitPrice!==1000)throw Error('PayPay金額の設定が不正です');x.payment={method:'paypay',amount,at:stamp(),refundAt:null,transactionId:id};if(!late)x.status='reserved'})}
  function adminAction(action,code){touchAdmin();const t=data.tickets.find(x=>x.code===code);if(!t)return setAlert('番号札が見つかりません','error');try{if(action==='confirm-paypay'||action==='late-paypay'){const late=action==='late-paypay';if(t.payment||t.paymentIntent!=='paypay'||(late?t.status!=='cancelled':t.status!=='pending_paypay'))return setAlert('PayPay取引確認の対象外です','error');const amount=t.unitPrice*t.participants,id=paypayTransactionId(code,amount);if(id===null)return;if(!confirm(`${code}：PayPay for Businessで「取引完了」、正しい店舗、金額 ${yen(amount)}、取引番号 ${id} の一致を確認しましたか？\n${late?'取消済みのため返金要確認として記録します。':'確認後に予約確定として記録します。'} この操作は決済・返金を実行しません。`))return;recordPaypay(code,id,late);setAlert(late?`${code} の後着決済を記録しました。実際の返金を確認してください`:`${code} のPayPay取引を確認し、予約を確定しました`);return}let message='';if(action==='pay-cash'){if(t.payment||t.status!=='reserved'||t.unitPrice<=0)return;const amount=t.unitPrice*t.participants;message=`${code}：実際に ${yen(amount)} の現金入金を確認しましたか？\nこの操作は決済を実行しません。`}else if(action==='seat')message=`${code}：支払い・保護者同伴・安全説明を対面で確認し、着席を記録しますか？`;else if(action==='complete')message=`${code}：体験完了を記録しますか？`;else if(action==='cancel')message=t.status==='pending_paypay'?`${code}：PayPay for Businessでこの番号に対応する取引が未成立であることを確認しましたか？\n支払確認待ちの枠を取消し、空席へ戻します。入金後に気づいた場合は後着決済を記録して返金してください。`:`${code}：番号札を取消しますか？${t.payment?'\n入金記録は残り、返金要確認になります。':''}`;else if(action==='refund')message=`${code}：実際の返金を完了したことを確認しましたか？\nこの操作は返金を実行しません。`;if(!message||!confirm(message))return;update(d=>{const x=d.tickets.find(y=>y.code===code);if(!x)throw Error('番号が見つかりません');if(action==='pay-cash'){if(x.status!=='reserved'||x.payment||x.unitPrice<=0)throw Error('入金済みか操作不能です');x.payment={method:'cash',amount:x.unitPrice*x.participants,at:stamp(),refundAt:null}}else if(action==='seat'){if(x.status!=='reserved'||!(x.payment||x.unitPrice===0))throw Error('入金未確認です');x.status='seated'}else if(action==='complete'){if(x.status!=='seated')throw Error('着席確認前です');x.status='completed'}else if(action==='cancel'){if(!['pending_paypay','reserved','seated'].includes(x.status))throw Error('取消できません');x.status='cancelled'}else if(action==='refund'){if(x.status!=='cancelled'||!x.payment||x.payment.refundAt)throw Error('返金待ちではありません');x.payment.refundAt=stamp()}});setAlert(`${code} の記録を更新しました`)}catch(e){setAlert(e.message,'error')}}
  function savePaypay(ev){ev.preventDefault();touchAdmin();const f=new FormData(ev.target),checks=Object.fromEntries(PAYPAY_CHECK_KEYS.map(k=>[k,f.has(k)])),enabled=f.has('paypayEnabled');if(enabled&&(data.settings.price!==1000||!PAYPAY_CHECK_KEYS.every(k=>checks[k])))return setAlert('単価1,000円と加盟店契約・会場承認・紙QR・PayPay for Businessの4項目を確認してください','error');try{update(d=>{if(enabled&&d.settings.price!==1000)throw Error('料金が1,000円ではありません');d.settings.paypayChecks=checks;d.settings.paypayEnabled=enabled});setAlert(enabled?'PayPayセルフ受付を有効にしました':'PayPayセルフ受付を停止しました')}catch(e){setAlert(e.message,'error')}}

  }
  function saveSettings(ev){
    ev.preventDefault();touchAdmin();if(data.tickets.length)return setAlert('番号札発行後は設定を変更できません','error');
    const f=new FormData(ev.target),roomText=String(f.get('roomLimit')||'');
    const price=PRICE,roomLimit=roomText===''?null:Number(roomText),duration=DURATION;
    const slots=Array.from({length:5},(_,i)=>({id:String(i+1),time:String(f.get(`time${i}`)||''),capacity:Number(f.get(`cap${i}`))}));
    const basic=Number.isInteger(price)&&price>=0&&price<=100000&&Number.isInteger(roomLimit)&&roomLimit>=1&&roomLimit<=30&&slots.every(x=>/^([01]\d|2[0-3]):[0-5]\d$/.test(x.time)&&Number.isInteger(x.capacity)&&x.capacity>=1&&x.capacity<=DAY_CAP);
    const timesOk=basic&&slots.every((x,i)=>minutes(x.time)>=605&&minutes(x.time)+duration<=950&&(i===0||minutes(x.time)>=minutes(slots[i-1].time)+duration+10));
    if(!basic||!timesOk){setAlert('在室上限・枠を確認してください。枠は10:05～15:50内、所要時間と10分の入替を確保してください。','error');return}
    try{update(d=>{if(d.tickets.length)throw Error('番号札が発行済みです');d.settings={...d.settings,date:EVENT_DATE,price,roomLimit,duration,open:false,slots}});setAlert('設定を保存しました。受付はまだ停止中です。')}catch(e){setAlert(e.message,'error')}
  }
  function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
  function exportCsv(){const header=['番号','開始','参加人数','同伴人数','小学生以下','状態','単価','請求額','支払予定','入金方法','入金額','PayPay取引番号','返金確認','発行日時'];const rows=data.tickets.map(t=>{const slot=data.settings.slots.find(x=>x.id===t.slotId);return [t.code,slot.time,t.participants,t.guardians,t.children?'はい':'いいえ',label(t),t.unitPrice,t.unitPrice*t.participants,t.paymentIntent||'',t.payment?.method||'',t.payment?.amount||0,t.payment?.transactionId||'',t.payment?.refundAt||'',t.createdAt]});const q=v=>`"${String(v).replaceAll('"','""')}"`;download(`稲門祭iPad受付_${EVENT_DATE}.csv`,'\ufeff'+[header,...rows].map(row=>row.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
  async function restore(){touchAdmin();const file=$('restore-file')?.files?.[0];if(!file)return setAlert('JSONファイルを選択してください','error');let next;try{next=valid(JSON.parse(await file.text()));normalize(next);valid(next);if(dayUsed(next)>DAY_CAP)throw Error('当日の参加定員20名を超えています')}catch(e){setAlert(`復元ファイルが不正です：${e.message}`,'error');return}if(!confirm(`現在の ${data.tickets.length} 件を、ファイル内の ${next.tickets.length} 件に置き換えますか？\n現在の記録は戻せません。`))return;try{next.revision=data.revision+1;next.settings.open=false;next.settings.paypayEnabled=false;save(next);adminActive=false;guestReset();setAlert('復元しました。PINで再ログインして内容を確認してください')}catch(e){setAlert(`復元できませんでした：${e.message}`,'error')}}
  $('guest').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.select){selected=b.dataset.select;participants=1;children=false;guardians=0;safetyAcknowledged=false;renderGuest();document.getElementById('guest-form')?.scrollIntoView({behavior:'smooth'})}else if(b.dataset.people){participants=Number(b.dataset.people);renderGuest();document.getElementById('guest-form')?.scrollIntoView({block:'nearest'})}else if(b.id==='cancel-choice'){selected=null;safetyAcknowledged=false;renderGuest()}else if(b.id==='reserve')book()});
  $('guest').addEventListener('change',e=>{if(e.target.id==='children'){children=e.target.checked;guardians=children?1:0;renderGuest()}else if(e.target.id==='guardian-count'){guardians=Number(e.target.value);renderGuest()}else if(e.target.id==='safety-check'){safetyAcknowledged=e.target.checked}});
  $('ticket').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='extend'){ticketDeadline=Math.min(ticketDeadline+30000,Date.now()+120000);renderTicket()}else if(b.id==='ticket-done')guestReset()});
  $('admin-entry').addEventListener('click',()=>{clearAlert();show('login')});
  $('login').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='pin-submit')doLogin();else if(b.id==='login-cancel')guestReset()});
  $('login').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doLogin()}});
  $('admin').addEventListener('submit',e=>{if(e.target.id==='settings-form')saveSettings(e);else if(e.target.id==='paypay-form')savePaypay(e);else if(e.target.id==='cash-form')cashRegister(e)});
  $('admin').addEventListener('click',e=>{touchAdmin();const b=e.target.closest('button');if(!b)return;if(b.dataset.action)return adminAction(b.dataset.action,b.dataset.code);try{if(b.id==='admin-exit'){adminActive=false;guestReset()}else if(b.id==='toggle-intake'){update(d=>{if(!d.pin||d.settings.price===null||d.settings.roomLimit===null)throw Error('PIN・料金・在室上限を設定してください');d.settings.open=!d.settings.open});setAlert(data.settings.open?'受付を開始しました':'受付を停止しました')}else if(b.id==='export-json'){download(`稲門祭iPad受付_${EVENT_DATE}.json`,JSON.stringify(data,null,2),'application/json');setAlert('JSONの保存先を確認し、別端末にも控えてください')}else if(b.id==='export-csv'){exportCsv();setAlert('CSVを保存しました')}else if(b.id==='change-pin'){changePin()}else if(b.id==='restore'){restore()}}catch(err){setAlert(err.message,'error')}});
  window.addEventListener('storage',e=>{if(e.key===KEY){try{data=read();storageReady=true;adminActive=false;guestReset();setAlert('記録が別画面で変わりました。内容を確認してください')}catch(err){storageReady=false;guestReset();setAlert('記録を読み込めません。受付を止めました','error')}}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='admin'){adminActive=false;guestReset()}else if(!document.hidden&&screen==='guest')renderGuest()});
  document.addEventListener('pointerdown',()=>{if(screen==='admin')touchAdmin()});
  setInterval(()=>{if(screen==='admin'&&Date.now()-adminLast>90000){adminActive=false;guestReset();setAlert('管理画面を自動で閉じました')}} ,5000);
  setInterval(()=>{if(screen==='guest')renderGuest()},30000);
  init();
  if(location.protocol==='https:'&&'serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script>
</body>
