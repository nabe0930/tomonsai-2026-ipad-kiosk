/* Visitor UI adapted from the user supplied V1-V11 design.
   Fonts are bundled separately. Administrative workflows keep their own layout. */
:root {
  --rd-paper: #f7f5f0;
  --rd-ink: #1a1e25;
  --rd-muted: #4f5560;
  --rd-soft: #6b7079;
  --rd-line: rgba(26,30,37,.16);
  --rd-rule: rgba(26,30,37,.3);
  --rd-blue: #0071a5;
  --rd-mono: 'Fragment Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --rd-sans: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
  --rd-serif: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
}
body[data-screen="guest"], body[data-screen="ticket"] {
  background-color: var(--rd-paper);
  background-image: linear-gradient(rgba(38,104,150,.07) 1px,transparent 1px), linear-gradient(90deg,rgba(38,104,150,.07) 1px,transparent 1px), linear-gradient(rgba(38,104,150,.035) 1px,transparent 1px), linear-gradient(90deg,rgba(38,104,150,.035) 1px,transparent 1px);
  background-size: 100px 100px,100px 100px,20px 20px,20px 20px;
  color: var(--rd-ink);
  font-family: var(--rd-sans);
  line-height: 1.55;
}
body[data-screen="guest"] #kiosk-header, body[data-screen="ticket"] #kiosk-header {
  max-width: 1120px;
  margin: 0 auto;
  padding: 32px 48px 16px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 32px;
  border: 0;
}
body[data-screen="guest"][data-guest-step="slots"] #kiosk-header {
  position: relative;
  padding-bottom: 18px;
}
body[data-screen="guest"][data-guest-step="slots"] #kiosk-header::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 48px;
  right: 48px;
  height: 1px;
  background: var(--rd-rule);
}
body[data-screen="guest"] #kiosk-header .event-logo, body[data-screen="ticket"] #kiosk-header .event-logo {
  display: block;
  width: 113px;
  height: auto;
  flex: none;
}
body[data-screen="guest"][data-guest-step="slots"] #kiosk-header .event-logo { width: 136px; }
#header-context { min-width: 0; }
.rd-header-info { display: flex; gap: 36px; align-items: flex-end; }
.rd-header-info > div { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.rd-header-info small, .rd-header-info .rd-info-label { color: var(--rd-soft); font-size: 14px; letter-spacing: .08em; }
.rd-header-info strong { display: flex; align-items: center; gap: 8px; font-size: 22px; line-height: 1.4; font-weight: 700; }
.rd-header-info .rd-info-dot { width: 10px; height: 10px; background: var(--rd-blue); border-radius: 50%; box-shadow: 0 0 0 4px rgba(0,113,165,.18); }
.rd-header-info .rd-info-dot.closed { background: var(--rd-soft); box-shadow: 0 0 0 4px rgba(107,112,121,.14); }
.rd-header-info .rd-room { font-family: var(--rd-mono); font-weight: 400; }
.rd-steps { width: 100%; }
ol.rd-steps { list-style: none; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 8px; margin: 0; padding: 0; }
.rd-steps li { display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; border-bottom: 3px solid var(--rd-line); font-size: 15px; line-height: 1.4; color: var(--rd-soft); }
.rd-steps li > span:first-child { white-space: nowrap; }
.rd-steps li b, .rd-steps .rd-step-number { font-family: var(--rd-mono); font-weight: 400; margin-right: 6px; }
.rd-steps li.done { border-bottom-color: var(--rd-ink); color: var(--rd-muted); }
.rd-steps li.current { border-bottom: 6px solid var(--rd-ink); padding-bottom: 5px; color: var(--rd-ink); font-weight: 700; }
.rd-steps li > i { display: none; }
body[data-screen="guest"] .rd-steps, body[data-screen="ticket"] .rd-steps { max-width: 660px; }
body[data-screen="guest"] #header-context:has(.rd-steps), body[data-screen="ticket"] #header-context:has(.rd-steps) { flex: 1; max-width: 660px; }
body[data-screen="guest"] main, body[data-screen="ticket"] main { max-width: 1120px; margin: 0 auto; padding: 24px 48px 28px; }
body[data-screen="guest"] main h1, body[data-screen="ticket"] main h1 { color: var(--rd-ink); }
body[data-screen="guest"] main button, body[data-screen="ticket"] main button, #reservation-review button {
  min-height: 52px;
  border-radius: 999px;
  background: var(--rd-ink);
  color: var(--rd-paper);
  font: 700 20px/1.4 var(--rd-sans);
  letter-spacing: 0;
}
body[data-screen="guest"] main button.secondary, body[data-screen="ticket"] main button.secondary, #reservation-review button.secondary {
  background: transparent;
  color: var(--rd-ink);
  border: 1.5px solid rgba(26,30,37,.4);
}
body[data-screen="guest"] main button:disabled, body[data-screen="ticket"] main button:disabled, #reservation-review button:disabled { background: #dcd9d2; color: var(--rd-muted); border-color: transparent; opacity: 1; cursor: not-allowed; }
body[data-screen="guest"] main button:focus-visible, body[data-screen="ticket"] main button:focus-visible, #reservation-review button:focus-visible, .rd-check input:focus-visible { outline: 3px solid var(--rd-blue); outline-offset: 4px; }
body[data-screen="guest"] main button svg, body[data-screen="ticket"] main button svg, #reservation-review button svg { flex: none; }
#guest .rd-top-grid { display: grid; grid-template-columns: minmax(0,1fr); gap: 28px; }
#guest .rd-intro { min-width: 0; display: grid; grid-template-columns: minmax(0,1fr) 232px; gap: 26px 32px; align-items: start; }
#guest .rd-hero { min-width: 0; padding: 0; }

  function ticketCard(t){

      if(!t.payment&&t.unitPrice>0){if(TEST_MODE||t.paymentChoice==='paypay'||paymentReady())actions+=action('pay-paypay','PayPayを確認');if(t.bookingSource!=='paypay-reservation')actions+=action('pay-cash','現金を確認')}

  function openQrDb(){
    return new Promise((resolve,reject)=>{
      if(!window.indexedDB)return reject(Error('このブラウザでは画像保存を利用できません'));
      let req;try{req=indexedDB.open(QR_DB,1)}catch(e){return reject(Error('画像保存を開けません'))}
      req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(QR_STORE))req.result.createObjectStore(QR_STORE)};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(Error('画像保存を開けません'));
      req.onblocked=()=>reject(Error('別画面が画像保存を使用中です。閉じてやり直してください'));
    });
  }
  async function qrTransaction(mode,action){
    const db=await openQrDb();
    return new Promise((resolve,reject)=>{
      let result,done=false;
      const finish=(error)=>{if(done)return;done=true;db.close();error?reject(error):resolve(result)};
      let tx,req;try{tx=db.transaction(QR_STORE,mode);req=action(tx.objectStore(QR_STORE))}catch(e){db.close();reject(Error('画像保存を操作できません'));return}
      req.onsuccess=()=>{result=req.result};
      tx.oncomplete=()=>finish(null);
      tx.onerror=()=>finish(Error('画像保存の読み書きに失敗しました'));
      tx.onabort=()=>finish(Error('画像保存が中断されました'));
    });
  }
  async function readQr(includeRetired=false){
    const row=await qrTransaction('readonly',store=>store.get(QR_ID));
    if(row===undefined)return null;
    if(!row||!(row.kind===undefined||['personal','merchant','reference'].includes(row.kind))||!(row.sha256===undefined||/^[0-9a-f]{64}$/.test(row.sha256))||row.version!==1||!['image/png','image/jpeg'].includes(row.mime)||!(row.blob instanceof Blob)||row.blob.type!==row.mime||row.blob.size<1||row.blob.size>QR_MAX_BYTES||!Number.isInteger(row.width)||!Number.isInteger(row.height)||row.width<120||row.height<120||row.width>2048||row.height>2048)throw Error('保存されたQR画像が不正です。削除して登録し直してください');
    // Only the exact previous bundled personal QR follows the new bundled image.
    // Keep the stored row untouched; registration still checks the physical image.
    if(!includeRetired&&row.kind!=='merchant'&&await qrHash(row.blob)===RETIRED_BUILTIN_QR_HASH)return null;
    return row;
  }

      const ready=paypayQrReady(row),kind=paypayQrType()==='personal'?'個人のMyコード（送金）':'加盟店の決済QR';
      $('paypay-qr-status').textContent=qrBusy?'登録中…':ready?`PayPayのみで予約を受け付けます。使用中：${kind}${row?'':'（付属QR）'}。`:data.settings.paypayEnabled?'選択した種類に合うQRを登録してください。PayPay予約は停止中です。':'PayPay予約は停止中です。現金は開始回の空席で受け付けます。';

  async function decodeQrImage(file){
    const url=URL.createObjectURL(file);
    try{return await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve({width:img.naturalWidth,height:img.naturalHeight});img.onerror=()=>reject(Error('画像を開けません。PNGまたはJPEGを選んでください'));img.src=url})}
    finally{URL.revokeObjectURL(url)}
  }
  async function authorizeQrUpload(){
    if(adminActive&&screen==='admin'&&Date.now()-adminLast<=90000)return;
    const pin=prompt('ファイル選択中に管理画面が閉じました。保存するには6桁の運営者PINを再入力してください。');
    if(pin===null)throw Error('PIN再確認を取り消したため、画像を保存していません');
    if(!/^\d{6}$/.test(pin)||!data.pin)throw Error('運営者PINが正しくありません。画像を保存していません');
    const epoch=authEpoch,current=read();
    if(await hashPin(pin,current.pin.salt)!==current.pin.hash)throw Error('運営者PINが正しくありません。画像を保存していません');
    const fresh=read();
    if(document.hidden||authEpoch!==epoch||fresh.revision!==current.revision||JSON.stringify(fresh.pin)!==JSON.stringify(current.pin))throw Error('再認証中に画面または記録が変わりました。PINで入り直してください');
    data=fresh;adminActive=true;adminTab='settings';touchAdmin();show('admin');
  }
  async function stagePaypayFile(file,kind){
    if(qrBusy||!file)return;

    try{await authorizeQrUpload();touchAdmin();if($('paypay-qr-kind'))$('paypay-qr-kind').value=kind;if($('paypay-file-name'))$('paypay-file-name').textContent=`選択中：${file.name}（未登録）`}
    catch(e){pendingPaypayFile=null;pendingPaypayKind=null;setAlert(e.message,'error')}
  }
  async function qrHash(blob){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer())),x=>x.toString(16).padStart(2,'0')).join('')}
  function assertRegistrationCurrent(operation){
    if(!adminActive||screen!=='admin'||adminEpoch!==operation.epoch||Date.now()-adminLast>90000)throw Error('管理画面が閉じたため、登録を中止しました。PINで入り直してください');
    const current=read();
    if(current.revision!==operation.revision||JSON.stringify(current.pin)!==operation.pin)throw Error('登録中に記録が変わりました。確認してやり直してください');
  }
  async function registerPaypay(file,kind){
    if(qrBusy)return;
    qrBusy=true;let imageSaved=false,operation=null;
    try{
      await authorizeQrUpload();
      operation={epoch:adminEpoch,revision:data.revision,pin:JSON.stringify(data.pin)};
      let row;
      if(file){
        if(!['image/png','image/jpeg'].includes(file.type)||file.size<1||file.size>QR_MAX_BYTES)throw Error('PNGまたはJPEGの2 MB以下の画像を選んでください');
        const bytes=new Uint8Array(await file.slice(0,12).arrayBuffer());
        const png=bytes.length>=8&&[137,80,78,71,13,10,26,10].every((x,i)=>bytes[i]===x),jpeg=bytes.length>=3&&bytes[0]===255&&bytes[1]===216&&bytes[2]===255,actual=png?'image/png':jpeg?'image/jpeg':null;
        if(actual!==file.type)throw Error('ファイルの内容がPNGまたはJPEGと一致しません');
        const dimensions=await decodeQrImage(file);
        if(dimensions.width<120||dimensions.height<120||dimensions.width>2048||dimensions.height>2048)throw Error('画像の縦横は120～2048 pxにしてください');
        row={version:1,kind,mime:actual,blob:new Blob([file],{type:actual}),...dimensions,savedAt:stamp()};
      }else{
        row=await readQr(true);
        if(kind==='merchant'&&row?.kind!=='merchant')throw Error('加盟店の決済QR画像を選んでください');
        if(kind==='personal'&&row?.kind==='merchant')throw Error('個人のMyコード画像を選んでください');
        if(row)row={...row,kind,savedAt:stamp()};
      }
      const hash=row?await qrHash(row.blob):BUILTIN_QR_HASH;
      if(row)row.sha256=hash;
      assertRegistrationCurrent(operation);
      if(data.settings.paypayEnabled){update(d=>{d.settings.paypayEnabled=false});operation.revision=data.revision}
      if(row){
        await qrTransaction('readwrite',store=>store.put(row,QR_ID));
        const saved=await readQr(true);
        if(saved?.kind!==kind||saved.sha256!==hash||await qrHash(saved.blob)!==hash)throw Error('QR画像の保存確認に失敗しました。再登録してください');
        imageSaved=true;
      }
      const current=await readQr(true);
      if(row?current?.sha256!==hash||await qrHash(current.blob)!==hash:current!==null)throw Error('別画面でQRが変わりました。確認してやり直してください');
      assertRegistrationCurrent(operation);
      update(d=>{if(d.revision!==operation.revision||JSON.stringify(d.pin)!==operation.pin)throw Error('登録中に記録が変わりました。確認してやり直してください');d.settings.paypayQrType=kind;d.settings.paypayQrHash=hash;d.settings.paypayEnabled=true});
      operation.revision=data.revision;
      const finalQr=await readQr(true);assertRegistrationCurrent(operation);
      if(!paypayQrReady(finalQr,read()))throw Error('PayPayの有効化を確認できません。登録をやり直してください');
      pendingPaypayFile=null;pendingPaypayKind=null;if(screen==='admin'&&adminActive)renderAdmin();
      setAlert('登録しました。予約はPayPayのみ、現金は開始回の空席で受け付けます');
    }catch(e){setAlert(`${imageSaved?'QR画像は保存済みですが、登録完了を確認できませんでした。':'PayPayを登録できませんでした。'} ${e.message}`,'error')}
    finally{qrBusy=false;await refreshPaymentReady();if(screen==='admin'&&adminActive)await refreshQrAdmin()}
  }
  async function stopPaypay(){
    if(qrBusy||!adminActive||screen!=='admin')return;

  async function deleteQr(){
    if(qrBusy||!adminActive||screen!=='admin')return;
    if(!ask('登録QRを削除しますか？PayPayを停止します。予約・入金記録は残ります。'))return;
    qrBusy=true;
    try{touchAdmin();update(d=>{d.settings.paypayEnabled=false;d.settings.paypayQrHash=null});await qrTransaction('readwrite',store=>store.delete(QR_ID));if(await readQr()!==null)throw Error('削除後の確認に失敗しました');pendingPaypayFile=null;pendingPaypayKind=null;setAlert('登録QRを削除しました。PayPayは停止中です')}
    catch(e){setAlert(`QR画像を削除できませんでした：${e.message}`,'error')}
    finally{qrBusy=false;await refreshPaymentReady();if(screen==='admin'&&adminActive)await refreshQrAdmin()}

    if(!reason&&(remoteNow()===null||remoteNow()>=cmd.expiresAt))reason='expired';
    if(!reason&&(!t||t.createdAt!==cmd.expectedCreatedAt||hash!==cmd.expectedTicketHash))reason='stale-ticket';
    if(!reason&&cmd.kind==='confirm-paypay'&&(t.status!=='reserved'||t.payment||t.paymentIntent||t.paymentChoice!=='paypay'||t.unitPrice!==1000))reason='not-applicable';
    if(!reason&&cmd.kind==='cancel'&&!['pending_paypay','reserved','seated'].includes(t.status))reason='not-applicable';
    const next=structuredClone(fresh),x=next.tickets.find(t=>t.code===cmd.code);next.revision++;
    if(!reason){if(cmd.kind==='cancel')x.status='cancelled';else x.payment={method:ticketQrType(x)==='personal'?'paypay-personal':'paypay-manual',amount:x.participants*x.unitPrice,at:new Date(remoteNow()).toISOString(),refundAt:null}}
    next.remoteReceipts=[...(next.remoteReceipts||[]),{roomId:c.roomId,id:cmd.id,state:reason?'rejected':'applied',reason,resultRevision:next.revision}].slice(-500);
    save(next);if(!reason)remoteRenderChanges();return true;
  }
  function remoteSaved(){try{remoteSchedule()}catch{remoteState='共有の送信待ちです。受付記録は保存されています'}}
  function remoteSchedule(){if(!REMOTE_SERVER||location.protocol==='file:')return;remoteQueued=true;if(remoteBusy||remoteTimer)return;remoteTimer=setTimeout(()=>{remoteTimer=null;remoteSync().catch(()=>{})},100)}
  async function remoteSync(){
    if(remoteBusy)return;const c=remoteReadConfig();if(!c||document.hidden)return;
    if((!c.established||c.pendingPairCode)&&!c.revoking)return;
    remoteBusy=true;remoteQueued=false;
    try{if(c.revoking){await remoteFinishRevoke(c);return}
      let rounds=0;
      do{remoteQueued=false;if(!remoteSame(c)||document.hidden)break;const foregroundEpoch=remoteVisibilityEpoch,fresh=read(),snapshot=await remoteSnapshot(fresh);
        if(!remoteSame(c)||document.hidden)break;
        const receipts=(fresh.remoteReceipts||[]).filter(r=>r.roomId===c.roomId).slice(-100).map(({id,state,reason,resultRevision})=>({id,state,reason,resultRevision}));
        const result=await remoteRequest(c,'/api/rooms/'+c.roomId+'/sync',{snapshot,receipts});
        if(!remoteSame(c))break;if(foregroundEpoch!==remoteVisibilityEpoch){remoteQueued=true;break}if(!Array.isArray(result.commands)||result.commands.length>100)throw Error('invalid-commands');
        remoteLastSent=result.serverTime;remoteState='同期済み';remoteRefreshStatus();
        for(const cmd of result.commands){if(document.hidden||!remoteSame(c))break;if(await remoteApply(c,cmd))remoteQueued=true}
        rounds++;
      }while(remoteQueued&&rounds<4&&!document.hidden);
    }catch(e){remoteState=e.code==='unauthorized'?'接続が無効です。接続設定を確認してください':'未送信の変更があります。ネット接続後に自動で再試行します';remoteRefreshStatus()}
    finally{remoteBusy=false;if(remoteQueued)remoteSchedule()}
  }
  setInterval(()=>{if(REMOTE_SERVER){remoteRefreshStatus();remoteSchedule()}},5000);
  window.addEventListener('online',remoteSchedule);
  window.addEventListener('pageshow',remoteSchedule);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)remoteVisibilityEpoch++;else remoteSchedule()});

  init();
  remoteSchedule();
  refreshPaymentReady();
  if(location.protocol==='https:'&&'serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script>
